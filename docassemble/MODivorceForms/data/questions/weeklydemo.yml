---
variable name: holidays
use objects: True
data:
  mlk:
    description: "Martin Luther King Day"
    even_default: petitioner
    odd_default: respondent
  president:
    description: "President’s Day"
    even_default: respondent
    odd_default: petitioner
  memorial:
    description: "Memorial Day"
    even_default: petitioner
    odd_default: respondent
  independence:
    description: "Independence Day"
    even_default: respondent
    odd_default: petitioner
  labor:
    description: "Labor Day"
    even_default: petitioner
    odd_default: respondent
  thanksgiving:
    description: "Thanksgiving"
    even_default: respondent
    odd_default: petitioner
  halloween:
    description: "Halloween"
    even_default: petitioner
    odd_default: respondent
  xmas_eve:
    description: "Christmas Eve"
    even_default: respondent
    odd_default: petitioner
  xmas_day:
    description: "Christmas Day"
    even_default: petitioner
    odd_default: respondent
  mother:
    description: "Mother’s Day"
    even_default: respondent
    odd_default: petitioner
  father:
    description: "Father’s Day"
    even_default: petitioner
    odd_default: respondent
  petitioner_birthday:
    description: "Petitioner’s Birthday"
    even_default: petitioner
    odd_default: petitioner
  respondent_birthday:
    description: "Respondent’s Birthday"
    even_default: respondent
    odd_default: respondent
  children_birthday:
    description: "Child(ren)'s Birthday"
    even_default: respondent
    odd_default: petitioner
---
question: ${ holidays[i]["description"] }
fields:
  - Even Numbered Years: holidays[i]['even_years']
    datatype: radio
    choices:
     - ${ petitioner.name.first }
     - ${ respondent.name.first }
  - Odd Numbered Years: holidays[i]['odd_years']
    datatype: radio
    choices:
     - ${ petitioner.name.first }
     - ${ respondent.name.first }
  - Physical custody from time: holidays[i]["custody_from_time"]
    datatype: time
  - Physical custody to time: holidays[i]['custody_to_time']
    datatype: time
---
objects: 
  - other_holidays: DAList.using(object_type=DAObject, complete_attribute='complete')
---
question: Do you want to add any other holidays, including special holidays and occassions?
fields:
  - Other holidays: other_holidays.there_are_any
    datatype: yesnoradio
---
question: Do you want to add any more holidays?
fields:
  - Other holidays: other_holidays.there_is_another
    datatype: yesnoradio
---
question: Other holidays information
subquestion: |
  % if len(other_holidays.complete_elements()) > 0:
  You have already mentioned:
  % for other_holiday in other_holidays.complete_elements():
  
   - ${ other_holiday.description }
  % endfor
  % endif
fields:
 - Description: other_holidays[i].description
 - Even Numbered Years: other_holidays[i].even_years
   datatype: radio
   choices:
     - ${ petitioner.name.first }: petitioner
     - ${ respondent.name.first }: respondent
 - Odd Numbered Years: other_holidays[i].odd_years
   datatype: radio
   choices:
     - ${ petitioner.name.first }: petitioner
     - ${ respondent.name.first }: respondent
 - Physical custody from: other_holidays[i].custody_from_time
   datatype: time
 - Physical custody to: other_holidays[i].custody_to_time
   datatype: time
continue button field: other_holidays[i].complete
