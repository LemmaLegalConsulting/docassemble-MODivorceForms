modules:
  - .function_import
---
mandatory: True
code: |
  case.filed
  exchanges.gather()
  biweekly_schedule_review
  if not holidays_default:
    for key in holidays.keys():
      if holidays[key]['different']:
        holidays[key]['even_years']
  holidays_review
  other_holidays.gather()
  mo_divorce_forms_download
---
include:
  - shared.yml
---
objects: 
  - exchanges: DAList.using(object_type=DAObject,there_are_any=True,complete_attribute="complete")
---
code: |
  exchanges[0].starting_date = "0"
  exchanges[0].information
  exchanges[0].complete = True
---
code: |
  exchanges[i].starting_date = exchanges[i-1].exchange_date
  exchanges[i].starting_parent = exchanges[i-1].exchange_parent
  exchanges[i].exchange_parent = exchanges[i-1].starting_parent
  exchanges[i].information
  exchanges[i].complete = True
---
question: Do you want to add another exchange?
subquestion: |
  % if float(exchanges.complete_elements()[-1].exchange_date) < 13: 
  If you say no, then ${ exchanges.complete_elements()[-1].exchange_parent } will be listed as having the children for the remainder of the biweekly schedule.
  % endif
fields:
  - Add another exchange?: exchanges.there_is_another
    datatype: yesnoradio
---
if: len(exchanges.complete_elements()) > 0 and exchanges.complete_elements()[-1].exchange_parent != exchanges[0].starting_parent
code: |
  exchanges.there_is_another = True
---
reconsider: remaining_days
id: exchange intro
question: Schedule for Exchange
subquestion: |
fields:
  - "Who should have the child at the start of the schedule?": starting_parent
    choices:
      - ${ users[0].name.full() }: users0
      - ${ other_parties[0].name.full() }: other_parties0
  - Do you want to use a schedule template or build your own schedule?: use_template
    choices:
      - Use a template: template
      - Build a schedule: build
  - What template do you want to use?: template_choice
    choices:
      - "Every other week, exchange on Monday": every_other_week_monday
      - "Every other week, exchange on Saturday": every_other_week_saturday
      - "2-2-3": two_two_three
      - "2-2-5-5": two_two_five_five
      - "3-4-4-3": three_four_four_three
      - "Every weekend": every_weekend
      - "Every other weekend": every_other_weekend
    js show if: |
      val('use_template') === "template"
  - note: |
      [FILE every_other_week_monday.png, 100%]
      

    js show if: |
      val('template_choice') === "every_other_week_monday"
  - note: |
      [FILE every_other_week_saturday.png, 100%]
      

    js show if: |
      val('template_choice') === "every_other_week_saturday"
  - note: |
      [FILE two_two_three.png, 100%]
      

    js show if: |
      val('template_choice') === "two_two_three"
  - note: |
      [FILE two_two_five_five.png, 100%]
      

    js show if: |
      val('template_choice') === "two_two_five_five"
  - note: |
      [FILE three_four_four_three.png, 100%]
      

    js show if: |
      val('template_choice') === "three_four_four_three"
  - note: |
      [FILE every_weekend.png, 100%]
      

    js show if: |
      val('template_choice') === "every_weekend"
  - note: |
      [FILE every_other_weekend.png, 100%]
      

    js show if: |
      val('template_choice') === "every_other_weekend"
  - note: |
      ${ users[0] } [FILE purple.png, 20px]
      
      ${ other_parties[0] } [FILE green.png, 20px]
    js show if: |
      val('starting_parent') === "users0" && val('template_choice') != null
  - note: |
      ${ other_parties[0] } [FILE purple.png, 20px]
      
      ${ users[0] } [FILE green.png, 20px]
    js show if: |
      val('starting_parent') === "other_parties0" && val('template_choice') != null
validation code: |
  if starting_parent == "users0":
    exchange_parent = "other_parties0"
  else:
    exchange_parent = "users0"
---
question: Make your own schedule
subquestion: |
  Each exchange should be written on the Weekend and Weekday Exchange Schedule. The parents
  shall have physical custody of the children as they agree. In the event they do not agree, then the
  parents shall exchange the children as set forth in the residential schedules.

  Each parent shall consider reasonable changes when requested by the other parent or the children.
  If a significant change is made, either parent may reduce their agreement to writing. All changes are
  unenforceable unless in writing and signed by both parents.


fields:
  - "Who should have the child at the start of the schedule?": exchanges[0].temp_starting_parent
    choices:
      - ${ users[0].name.full() }: "users0"
      - ${ other_parties[0].name.full() }: "other_parties0"
    default: starting_parent
  - "What is the day of the first transfer?": exchanges[0].exchange_date
    datatype: dropdown
    code: |
      remaining_days
  - "What time?": exchanges[0].exchange_time
    datatype: time
  - "Should the child be dropped off or picked up?": exchanges[0].exchange_method
    datatype: radio
    choices:
      -  Drop off: Drop off
      -  Pick up: Pick up
  - "Where should ${ users[0] } drop off the child?": exchanges[0].exchange_location
    js show if: |
      val('exchanges[0].exchange_method') === "Drop off" && val('exchanges[0].temp_starting_parent') == "users0"
    choices:
      - ${ other_parties[0].possessive('house') }: house
      - School: school
      - Other: other
  - "Where should ${ other_parties[0] } drop off the child?": exchanges[0].exchange_location
    js show if: |
      val('exchanges[0].exchange_method') === "Drop off" && val('exchanges[0].temp_starting_parent') == "other_parties0"
    choices:
      - ${ users[0].possessive('house') }: house
      - School: school
      - Other: other
  - "Where should ${ other_parties[0] } pick up the child?": exchanges[0].exchange_location
    js show if: |
      val('exchanges[0].exchange_method') === "Pick up" && val('exchanges[0].temp_starting_parent') == "users0"
    choices:
      - ${ users[0].possessive('house') }
      - School
      - Other
  - "Where should ${ users[0] } pick up the child?": exchanges[0].exchange_location
    js show if: |
      val('exchanges[0].exchange_method') === "Pick up" && val('exchanges[0].temp_starting_parent') == "other_parties0"
    choices:
      - ${ other_parties[0].possessive('house') }
      - School
      - Other
  - "Explain": exchanges[0].exchange_location_other
    js show if: |
      val('exchanges[0].exchange_location') === "Other"
  - "Add pick up from school by ${ other_parties[0] }?": exchanges[0].add_pick_up_from_school
    datatype: yesnoradio
    js show if: |
      val("exchanges[0].exchange_method") === "Drop off" && val("exchanges[0].exchange_location") === "school" && val('exchanges[0].temp_starting_parent') == "users0"
  - "Add pick up from school by ${ users[0] }?": exchanges[0].add_pick_up_from_school
    datatype: yesnoradio
    js show if: |
      val("exchanges[0].exchange_method") === "Drop off" && val("exchanges[0].exchange_location") === "school" && val('exchanges[0].temp_starting_parent') == "other_parties0"
  - "What time?": exchanges[0].exchange_time2
    datatype: time
    js show if: |
      val('exchanges[0].add_pick_up_from_school') === true
continue button field: exchanges[0].information  
validation code: |
  if exchanges[0].temp_starting_parent == "users0":
    exchanges[0].starting_parent = users[0].name.full()
    exchanges[0].exchange_parent = other_parties[0].name.full()
  elif exchanges[0].starting_parent == "other_parties0":
    exchanges[0].starting_parent = other_parties[0].name.full()
    exchanges[0].exchange_parent = users[0].name.full()
---

reconsider: remaining_days
id: exchange information other than intro
question: Schedule for Exchange
subquestion: |
  ${ exchanges[i].starting_parent }
fields:
  - What is the day of the next transfer to ${ exchanges[i].exchange_parent }?: exchanges[i].exchange_date
    datatype: dropdown
    code: |
      remaining_days
  - What time?: exchanges[i].exchange_time
    datatype: time
  - Should ${ exchanges[i].starting_parent } drop off the child or should ${ exchanges[i].exchange_parent } pick up the child?: exchanges[i].exchange_method
    datatype: radio
    choices:
      -  ${ exchanges[i].starting_parent } should drop off the child: Drop off
      -  ${ exchanges[i].exchange_parent } should pick up the child: Pick up
  - Where should ${ exchanges[i].starting_parent } drop off the child?: exchanges[i].exchange_location
    js show if: |
      val('exchanges[i].exchange_method') === "Drop off" 
    choices:
      - ${ possessify(exchanges[i].exchange_parent,'house') }: house
      - School: school
      - Other: other
  - Where should ${ exchanges[i].exchange_parent } pick up the child?: exchanges[i].exchange_location
    js show if: |
      val('exchanges[i].exchange_method') === "Pick up"
    choices:
      - ${ possessify(exchanges[i].starting_parent,'house') }: house
      - School: school
      - Other: other
  - Explain: exchanges[i].exchange_location_other
    js show if: |
      val('exchanges[i].exchange_location') === "other"
  - Add pick up from school by ${ exchanges[i].exchange_parent } ?: exchanges[i].add_pick_up_from_school
    datatype: yesnoradio
    js show if: |
      val("exchanges[i].exchange_method") === "Drop off" && val("exchanges[i].exchange_location") === "school"
  - What time: exchanges[i].exchange_time2
    datatype: time
    js show if: |
      val('exchanges[i].add_pick_up_from_school') === true
continue button field: exchanges[i].information  

