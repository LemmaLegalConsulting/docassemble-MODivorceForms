code: |
  for exchange in exchanges.complete_elements():
    if exchange.starting_date == exchange.exchange_date:
      if exchange.exchange_method == "Drop off":
        temp_description = str(format_time(exchange.exchange_time))  + " " + exchange.starting_parent + " drops off children at " + (possessify(exchange.exchange_parent, 'house') if exchange.exchange_location == "house" else exchange.exchange_location)  + "\n"
        if exchange.exchange_location == "school" and exchange.add_pick_up_from_school:
          temp_description += str(format_time(exchange.exchange_time2)) + " " + exchange.exchange_parent + " picks up children from " + exchange.exchange_location + "\n"
      elif exchange.exchange_method == "Pick up":
        temp_description = str(format_time(exchange.exchange_time)) + " " + exchange.exchange_parent + " picks up children from " + (possessify(exchange.starting_parent, 'house') if exchange.exchange_location == "house" else exchange.exchange_location) + "\n"
      starting_weekly_list[int(exchange.exchange_date)] += temp_description
    elif int(exchange.starting_date) == 0:
      if exchange.instanceName == "exchanges[0]":
        starting_date = int(exchange.starting_date)
      else:
        starting_date = int(exchange.starting_date)+1
      for date in range(starting_date,(int(exchange.exchange_date))):
        starting_weekly_list[date] = exchange.starting_parent
      if exchange.exchange_method == "Drop off":
        temp_description = str(format_time(exchange.exchange_time)) + " " + exchange.starting_parent + " drops off children at " + (possessify(exchange.exchange_parent, 'house') if exchange.exchange_location == "house" else exchange.exchange_location)  + "\n"
        if exchange.exchange_location == "school" and exchange.add_pick_up_from_school:
          temp_description += str(format_time(exchange.exchange_time2)) + " " + exchange.exchange_parent + " picks up children from " + exchange.exchange_location + "\n"
      elif exchange.exchange_method == "Pick up":
        temp_description = str(format_time(exchange.exchange_time)) + " " + exchange.exchange_parent + " picks up children from " + (possessify(exchange.starting_parent, 'house') if exchange.exchange_location == "house" else exchange.exchange_location) + "\n"
      starting_weekly_list[int(exchange.exchange_date)] += temp_description
    else:
      for date in range(int(exchange.starting_date) + 1,(int(exchange.exchange_date))):
        starting_weekly_list[date] = exchange.starting_parent
      if exchange.exchange_method == "Drop off":
        temp_description = str(format_time(exchange.exchange_time)) + " " + exchange.starting_parent + " drops off children at " + (possessify(exchange.exchange_parent, 'house') if exchange.exchange_location == "house" else exchange.exchange_location)  + "\n"
        if exchange.exchange_location == "school" and exchange.add_pick_up_from_school:
          temp_description += str(format_time(exchange.exchange_time2)) + " " + exchange.exchange_parent + " picks up children from " + exchange.exchange_location + "\n"
      elif exchange.exchange_method == "Pick up":
        temp_description = str(format_time(exchange.exchange_time)) + " " + exchange.exchange_parent + " picks up children from " + (possessify(exchange.starting_parent, 'house') if exchange.exchange_location == "house" else exchange.exchange_location) + "\n"
      starting_weekly_list[int(exchange.exchange_date)] += temp_description
  if exchanges.gathered and int(exchanges[-1].exchange_date) < 14:
    for date_index in range(int(exchanges[-1].exchange_date) + 1,14):
      starting_weekly_list[date_index] = exchanges[-1].exchange_parent
  biweekly_schedule = starting_weekly_list
