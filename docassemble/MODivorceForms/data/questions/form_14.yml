---
id: form_14_starting calculations
generic object: ALIndividual
code: |
  x.monthly_income_1 = x.jobs.total(times_per_year=12) + x.self_employment_income + x.other_income.total(times_per_year = 12)
  if x.montly_income_1 < 1000:
    x.support_obligation_2c2_income_index = 1000
  elif x.montly_income_1 > 30000:
    x.support_obligation_2c2_income_index = 30000
  else:
    x.support_obligation_2c2_income_index = x.montly_income_1//50*50
  x.support_obligation_2c2 = basic_child_support_schedule[len(x.other_children)][x.support_obligation_2c2_income_index]
  x.total_adjustment_2c = x.support_obligation_2c2 - x.other_child_support_received
  x.adjusted_monthly_gross_income_3 = x.monthly_income_1 + x.maintenance_received + x.maintenance_other_received - x.other_child_support_paid - x.maintenance_paid - x.total_adjustment_2c
  x.form_14_starting_calculations = True  
---
code: |
  basic_child_support_schedule = objects_from_file("basic_child_support_schedule.json")
---  
id: form 14 calculations
reconsider:
  - support_payer.form_14_starting_calculations
  - support_recipient.form_14_starting_calculations
code: |
  combined_adjusted_income_3 = support_payer.adjusted_monthly_gross_income_3 + support_recipient.adjusted_monthly_gross_income_3
  support_payer.income_share_4 = support_payer.adjusted_monthly_gross_income_3/combined_adjusted_income_3
  support_recipient.income_share_4 = support_recipient.adjusted_monthly_gross_income_3/combined_adjusted_income_3
  if combined_adjusted_income_3 < 1000:
    combined_income_index = 20
  elif combined_adjusted_income_3 > 30000:
    combined_income_index = 30000
  else:
    combined_income_index = combined_adjusted_income_3//50*50
  if len(children) > 6:
    basic_child_support_amount_5 = basic_child_support_schedule[6][combined_income_index]
  else:
    basic_child_support_amount_5 = basic_child_support_schedule[len(children)][combined_income_index]
  if support_recipient.adjusted_monthly_gross_income_3 < 1251:
    credit_subtract = 0
  elif support_recipient.adjusted_monthly_gross_income_3 > 3583:
    credit_subtract = .15
  else:
    credit_subtract = ((support_recipient.adjusted_monthly_gross_income_3-1250)//166.5+1)/100
  if len(children) == 1:
    support_recipient.childcare_tax_credit_6a2 = 250*(.35-credit_subtract)
  else:
    support_recipient.childcare_tax_credit_6a2 = 500*(.35-credit_subtract)
  support_recipient.total_adjusted_child_care_costs_6a = support_recipient.work_childcare_expenses - support_recipient.childcare_tax_credit_6a2
  support_recipient.total_childrearing_costs_7 =  support_recipient.total_adjusted_child_care_costs_6a + support_recipient.health_insurance_costs + support_recipient.extraordinary_medical_costs.total(times_per_year=12) + sum([cost.total(times_per_year=12) for cost in support_recipient.extraordinary_childrearing_costs.included_in_form_14])
  support_payer.total_childrearing_costs_7 = support_payer.work_childcare_expenses + support_payer.health_insurance_costs + support_payer.extraordinary_medical_costs.total(times_per_year=12) + sum([cost.total(times_per_year=12) for cost in support_payer.extraordinary_childrearing_costs.included_in_form_14])
  total_childrearing_costs_7 = support_recipient.total_childrearing_costs_7 + support_payer.total_childrearing_costs_7
  combined_child_support_costs_8 = basic_child_support_amount_5 + total_childrearing_costs_7
  support_payer.support_obligation_9 = combined_child_support_costs_8 * support_payer.income_share_4
  support_recipient.support_obligation_9 = combined_child_support_costs_8 * support_recipient.income_share_4
  support_payer.childrearing_credit_10 = support_payer.total_childrearing_costs_7
  if visitation_nights < 36:
    support_payer.visitation_adjustment_11_percentage = 0
  elif visitation_nights < 73:
    support_payer.visitation_adjustment_11_percentage = 6
  elif visitation_nights < 92:
    support_payer.visitation_adjustment_11_percentage = 9
  elif visitation_nights < 110:
    support_payer.visitation_adjustment_11_percentage = 10
  elif visitation_nights < 116:
    support_payer.visitation_adjustment_11_percentage = 13
  elif visitation_nights < 120:
    support_payer.visitation_adjustment_11_percentage = 15
  elif visitation_nights < 126:
    support_payer.visitation_adjustment_11_percentage = 17
  elif visitation_nights < 131:
    support_payer.visitation_adjustment_11_percentage = 20
  elif visitation_nights < 137:
    support_payer.visitation_adjustment_11_percentage = 23
  elif visitation_nights < 142:
    support_payer.visitation_adjustment_11_percentage = 25
  elif visitation_nights < 148:
    support_payer.visitation_adjustment_11_percentage = 27
  elif visitation_nights < 153:
    support_payer.visitation_adjustment_11_percentage = 28
  elif visitation_nights < 159:
    support_payer.visitation_adjustment_11_percentage = 29
  elif visitation_nights < 165:
    support_payer.visitation_adjustment_11_percentage = 30
  elif visitation_nights < 171:
    support_payer.visitation_adjustment_11_percentage = 31
  elif visitation_nights < 176:
    support_payer.visitation_adjustment_11_percentage = 32
  elif visitation_nights < 181:
    support_payer.visitation_adjustment_11_percentage = 33
  else:
    support_payer.visitation_adjustment_11_percentage = 33
  support_payer.visitation_adjustment_11 = basic_child_support_amount_5*support_payer.visitation_adjustment_11_percentage*.01
  support_payer.presumed_child_support_amount_12 = support_payer.support_obligation_9 - support_payer.childrearing_credit_10 - support_payer.visitation_adjustment_11
  if len(children) > 5:
    basic_child_support_amount_5_6 = basic_child_support_schedule[6][combined_income_index]
    support_payer.presumed_child_support_amount_6_children = (basic_child_support_amount_5_6 + total_childrearing_costs_7) * support_payer.income_share_4 - support_payer.childrearing_credit_10 - (basic_child_support_amount_5_6) * support_payer.visitation_adjustment_11_percentage*.01
  else:
    support_payer.presumed_child_support_amount_6_children = None
  if len(children) > 4:
    basic_child_support_amount_5_5 = basic_child_support_schedule[5][combined_income_index]
    support_payer.presumed_child_support_amount_5_children = (basic_child_support_amount_5_5 + total_childrearing_costs_7) * support_payer.income_share_4 - support_payer.childrearing_credit_10 - (basic_child_support_amount_5_5) * support_payer.visitation_adjustment_11_percentage*.01
  else:
    support_payer.presumed_child_support_amount_5_children = None
  if len(children) > 3:
    basic_child_support_amount_5_4 = basic_child_support_schedule[4][combined_income_index]
    support_payer.presumed_child_support_amount_4_children = (basic_child_support_amount_5_4 + total_childrearing_costs_7) * support_payer.income_share_4 - support_payer.childrearing_credit_10 - (basic_child_support_amount_5_4) * support_payer.visitation_adjustment_11_percentage*.01
  else:
    support_payer.presumed_child_support_amount_4_children = None
  if len(children) > 2:
    basic_child_support_amount_5_3 = basic_child_support_schedule[3][combined_income_index]
    support_payer.presumed_child_support_amount_3_children = (basic_child_support_amount_5_3 + total_childrearing_costs_7) * support_payer.income_share_3 - support_payer.childrearing_credit_10 - (basic_child_support_amount_5_3) * support_payer.visitation_adjustment_11_percentage*.01
  else:
    support_payer.presumed_child_support_amount_3_children = None
  if len(children) > 1:
    basic_child_support_amount_5_2 = basic_child_support_schedule[2][combined_income_index]
    support_payer.presumed_child_support_amount_2_children = (basic_child_support_amount_5_2 + total_childrearing_costs_7) * support_payer.income_share_2 - support_payer.childrearing_credit_10 - (basic_child_support_amount_5_2) * support_payer.visitation_adjustment_11_percentage*.01
  else:
    support_payer.presumed_child_support_amount_2_children = None
  if len(children) > 0:
    basic_child_support_amount_5_1 = basic_child_support_schedule[1][combined_income_index]
    support_payer.presumed_child_support_amount_1_children = (basic_child_support_amount_5_1 + total_childrearing_costs_7) * support_payer.income_share_1 - support_payer.childrearing_credit_10 - (basic_child_support_amount_5_1) * support_payer.visitation_adjustment_11_percentage*.01
  else:
    support_payer.presumed_child_support_amount_1_children = None
  form_14_calculations = True
  
  
---
id: Child Support Amount Calculation Worksheet object
objects:
  - form_14_attachment: ALDocument.using(title="Child Support Amount Calculation Worksheet", filename="form_14", has_addendum=False, )
---
id: Child Support Amount Calculation Worksheet attachment
attachment:
  name: Child Support Amount Calculation Worksheet
  filename: form_14
  variable name: form_14_attachment[i]
  skip undefined: True
  pdf template file: form_14.pdf
  fields:
      - "Respondent CB": ${ child_support in ["respondent"] } 
      - "Petitioner CB": ${ child_support in ["petitioner", "none","third_party"] } 
      - "Total Number of Children": ${ len(children) } 
      - "Line 1 - PRS": ${ "{:.2f}".format(support_recipient.monthly_income_1) } 
      - "Line 1 PPS": ${ "{:.2f}".format(support_payer.monthly_income_1) } 
      - "Line 1a PRS": ${ "{:.2f}".format(support_recipient.maintenance_received) } 
      - "Line 1a PPS": ${ "{:.2f}".format(support_payer.maintenance_received) } 
      - "Line 2a PRS": ${ "{:.2f}".format(support_recipient.maintenance_other_paid) } 
      - "Line 2a PPS": ${ "{:.2f}".format(support_payer.maintenance_other_paid) } 
      - "Line 2b PRS": ${ "{:.2f}".format(support_recipient.maintenance_paid) } 
      - "Line 2b PPS": ${ "{:.2f}".format(support_payer.maintenance_paid) } 
      - "Line 2c(1) PRS": ${ support_recipient.other_children } 
      - "Line 2c(1) PPS": ${ support_payer.other_children } 
      - "2c(2) PPS": ${ "{:.2f}".format(support_payer.support_obligation_2c2) } 
      - "2c(2) PRS": ${ "{:.2f}".format(support_recipient.support_obligation_2c2) } 
      - "Line 2c(3) PPS": ${ "{:.2f}".format(support_payer.other_child_support_received) } 
      - "Line 2c(3) PRS": ${ "{:.2f}".format(support_recipient.other_child_support_received) } 
      - "Line 2c PRS": ${ "{:.2f}".format(support_recipient.total_adjustment_2c) } 
      - "Line 2c PPS": ${ "{:.2f}".format(support_payer.total_adjustment_2c) } 
      - "Line 3 PRS": ${ "{:.2f}".format(support_recipient.adjusted_monthly_gross_income_3) } 
      - "Line 3 PPS": ${ "{:.2f}".format(support_payer.adjusted_monthly_gross_income_3) } 
      - "Line 3 C": ${ support_recipient.adjusted_monthly_gross_income_3 + support_payer.adjusted_monthly_gross_income_3 } 
      - "Line 4 PRS": ${ "{:.1f}".format(support_recipient.adjusted_monthly_gross_income_3/(support_recipient.adjusted_monthly_gross_income_3 + support_payer.adjusted_monthly_gross_income_3)) } 
      - "Line 4 PPS": ${ "{:.1f}".format(support_payer.adjusted_monthly_gross_income_3/(support_recipient.adjusted_monthly_gross_income_3 + support_payer.adjusted_monthly_gross_income_3)) } 
      - "Line 5 C": ${ "{:.2f}".format(basic_child_support_amount_5) } 
      - "Line 6a(1) PRS": ${ "{:.2f}".format(support_recipient.work_childcare_expenses) } 
      - "Line 6a(2) PRS": ${ "{:.2f}".format(support_recipient.childcare_tax_credit_6a2) } 
      - "Line 6a PRS": ${ "{:.2f}".format(support_recipient.total_adjusted_child_care_costs_6a) } 
      - "Line 6b PPS": ${ "{:.2f}".format(support_payer.work_childcare_expenses) } 
      - "Line 6c PPS": ${ "{:.2f}".format(support_payer.health_insurance_costs) } 
      - "Line 6c PRS": ${ "{:.2f}".format(support_recipient.health_insurance_costs) } 
      - "Line 6d PRS": ${ "{:.2f}".format(support_recipient.extraordinary_medical_costs) } 
      - "Line 6d PPS": ${ "{:.2f}".format(support_payer.extraordinary_medical_costs) } 
      - "Line 6e PRS": ${ "{:.2f}".format(support_recipient.extraordinary_childrearing_costs) } 
      - "Line 6e PPS": ${ "{:.2f}".format(support_payer.extraordinary_childrearing_costs) } 
      - "Line 7 PPS": ${ "{:.2f}".format(support_payer.total_childrearing_costs_7  ) } 
      - "Line 7 PRS": ${ "{:.2f}".format(support_recipient.total_childrearing_costs_7  ) } 
      - "Line 7 C": ${ "{:.2f}".format(total_childrearing_costs_7) } 
      - "Line 8 C": ${ "{:.2f}".format(combined_child_support_costs_8) } 
      - "Line 9 PPS": ${ "{:.2f}".format(support_payer.support_obligation_9) } 
      - "Line 9 PRS": ${ "{:.2f}".format(support_recipient.support_obligation_9) } 
      - "Line 10 PPS": ${ "{:.2f}".format(support_payer.childrearing_credit_10) } 
      - "Line 11": ${ "{:.0f}".format(support_payer.visitation_adjustment_percentage_11) } 
      - "Line 11 PPS": ${ "{:.2f}".format(support_payer.visitation_adjustment_11) } 
      - "Line 12 PPS": ${ "{:.2f}".format(support_payer.presumed_child_support_12) } 

---
  
