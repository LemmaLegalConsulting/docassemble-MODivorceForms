---
include:
  - shared.yml
---
id: selected court display
mandatory: False
question: ${ selected_court }
---
id: court information
mandatory: False
question: |
  Information about ${ case.court_name }
subquestion: |
  Address: ${ case.address.on_one_line()}
  
  % if defined('case.photo_filename'):
  ${ case.photo }
  
  % endif

  % if defined('case.phone'):
  Phone: ${ case.phone }
  
  % endif  
  
  % if defined('case.website'):
  [Website](${ case.website })
  
  % endif  
  
  % if defined('case.rules'):
  [Rules](${ case.rules })
  
  % endif  
  
  
  
  % if defined('case.schedule'):
  ${ case.schedule }
  
  % endif  

  % if defined('case.legal_aid_program'):
  [${ case.legal_aid_program }](${ case.legal_aid_program_website } )
  
  % endif  

  TESTING INFO - WILL BE REMOVED
  
  Documents for 
  % if case.filed == "not_filed":
  Petitioner
  % else:
  Respondent
  % endif

  ## ALL DOCUMENTS
  % for doc in doc_list_selected.true_values():
   -   ${ doc_list_dictionary[doc] }
  
  % endfor

  ## REDACTED DOCUMENTS
  % for doc in doc_list_redacted.true_values():
   -   ${ doc_list_dictionary[doc] }
  
  % endfor
  
continue button field: info_displayed
---
variable name: doc_list_dictionary
data:
  petition_attachment: Petition
  answer_attachment: Answer
  parenting_plan_attachment: Parenting Plan
  notice_of_hearing_attachment: Notice of hearing
  certificate_of_dissolution_attachment: Certificate of dissolution
  judgment_attachment: Judgment
  property_statement_attachment: Property statement
  income_statement_attachment: Income statement
  fee_waiver_attachment: Fee waiver
  confidential_information_sheet_attachment: Confidential information sheet
  redaction_certification_attachment: Redaction certification
---
id: download next steps
mandatory: True
question: Download ${ info_displayed }
attachment:
  name: MO PRIYA Next Steps
  filename: mo_priya_next_steps
  docx template file: mo_divorce_forms_next_steps.docx
  skip undefined: True
  valid formats:
    - pdf
---
id: next steps testing questions
question: Next Steps testing questions
fields:
  - Petitioner or respondent: case.filed
    datatype: radio
    choices:
      - Petitioner: not_filed
      - Respondent: user1_filed
  - Minor children?: minor_children
    datatype: yesnoradio
  - Received welfare: received_welfare
    datatype: yesnoradio
  - code: |
      users[0].name_fields()
---
objects:
  - doc_list_selected: DADict.using(auto_gather=False)
  - doc_list_redacted: DADict.using(auto_gather=False)
---
code: |
  if case.filed in ["not_filed"]:
    doc_list_selected['petition_attachment'] = True
    doc_list_selected['answer_attachment'] = False
  else:
    doc_list_selected['petition_attachment'] = False
    doc_list_selected['answer_attachment'] = True
  if minor_children:
    doc_list_selected['parenting_plan_attachment'] = True
  else:
    doc_list_selected['parenting_plan_attachment'] = False
  doc_list_selected['notice_of_hearing_attachment'] = True 
  doc_list_selected['certificate_of_dissolution_attachment'] = True
  doc_list_selected['judgment_attachment'] = True
  doc_list_selected['property_statement_attachment'] = True
  doc_list_selected['income_statement_attachment'] = True   
  doc_list_selected['fee_waiver_attachment'] = True
  doc_list_selected['confidential_information_sheet_attachment'] = True
  doc_list_selected['redaction_certification_attachment'] = True
  doc_list_selected.gathered = True
---
code: |
  if case.filed in ["not_filed"]:
    doc_list_redacted['petition_attachment'] = True
    doc_list_redacted['answer_attachment'] = False
  else:
    doc_list_redacted['petition_attachment'] = False
    doc_list_redacted['answer_attachment'] = True
  if minor_children:
    doc_list_redacted['parenting_plan_attachment'] = True
  else:
    doc_list_redacted['parenting_plan_attachment'] = False
  doc_list_redacted['notice_of_hearing_attachment'] = True 
  doc_list_redacted['certificate_of_dissolution_attachment'] = True
  doc_list_redacted['judgment_attachment'] = True
  doc_list_redacted['property_statement_attachment'] = True
  doc_list_redacted['income_statement_attachment'] = True   
  doc_list_redacted['fee_waiver_attachment'] = True
  doc_list_redacted['confidential_information_sheet_attachment'] = False
  doc_list_redacted['redaction_certification_attachment'] = False
  doc_list_redacted.gathered = True
---