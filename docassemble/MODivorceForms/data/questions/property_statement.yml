
---
id: bankrupcy
generic object: ALIndividual
question: Bankruptcy
fields: 
  - Is ${ x.name_full() } currently in a bankruptcy proceeding?: x.in_bankruptcy
    datatype: yesnoradio
---
id: property statement additional provisions
question: Additional provisions for the Property Statement
fields:
  - Do you want to include additional provisions in the Statement of Property and Debt and Proposed Separation Agreement?: is_additional_provisions
    datatype: yesnoradio
  - Additional provisions: additional_provisions
    datatype: area
    show if: is_additional_provisions
---
code: |
  notice_date = today()
---
objects:
  - property_statement_attachment: DADict.using(object_type=ALDocument.using(has_addendum=True, default_overflow_message=AL_DEFAULT_OVERFLOW_MESSAGE), auto_gather=False, gathered=True)
---
comment: |
  One ALDocument per key. "redacted" is the copy filed publicly, "unredacted"
  is the copy filed under seal. Both are produced by the single attachment
  block below; the key is what decides whether redact() blacks out account
  numbers.
id: property statement per-key document settings
code: |
  property_statement_attachment[i].title = "Statement of Property and Debt and Proposed Separation Agreement"
  property_statement_attachment[i].filename = "property_statement" if i == "redacted" else "property_statement_unredacted"
---
id: property_statement enabled block
code: |
  property_statement_attachment[i].enabled = "property_statement_attachment" in doc_list_selected.true_values()
---
code: |
  bank_assets[i].is_amount_owed = False
---
code: |
  retirement_accounts[i].is_amount_owed = False
---
code: |
  life_insurance[i].is_amount_owed = False
---
code: |
  interest_in_contract[i].is_amount_owed = False
---
code: |
  interests_in_trust[i].is_amount_owed = False
---
code: |
  interest_in_litigation[i].is_amount_owed = False
---
code: |
  debts_owed_to_you[i].is_amount_owed = False
---
id: property statement overflow fields
comment: |
  The attachment calls safe_value() for petitioner.assets[0..15] and
  respondent.assets[0..15]. ALAddendumField has no default overflow_trigger, so
  every index the attachment can reference has to be configured here or the
  assembly dies with a missing-variable error on the first asset past the last
  configured index.
code: |
  property_statement_attachment[i].overflow_fields["petitioner.assets"].overflow_trigger = 16
  property_statement_attachment[i].overflow_fields["petitioner.assets"].label = "Additional Assets Awarded to " + petitioner.name.full()
  for row_number in range(16):
    property_statement_attachment[i].overflow_fields["petitioner.assets[" + str(row_number) + "].award_template_petitioner"].overflow_trigger = 40
    property_statement_attachment[i].overflow_fields["petitioner.assets[" + str(row_number) + "].award_template_petitioner"].label = "Complete description for asset listed for " + petitioner.name.full()
  property_statement_attachment[i].overflow_fields["respondent.assets"].overflow_trigger = 16
  property_statement_attachment[i].overflow_fields["respondent.assets"].label = "Additional Assets Awarded to " + respondent.name.full()
  for row_number in range(16):
    property_statement_attachment[i].overflow_fields["respondent.assets[" + str(row_number) + "].award_template_respondent"].overflow_trigger = 40
    property_statement_attachment[i].overflow_fields["respondent.assets[" + str(row_number) + "].award_template_respondent"].label = "Complete description for asset listed for " + respondent.name.full()
  property_statement_attachment[i].overflow_fields.gathered = True
---
attachment:
  variable name: property_statement_attachment[i].addendum
  docx template file: property_statement_attachment_addendum.docx
  redact: i == "redacted"
---
attachment:
