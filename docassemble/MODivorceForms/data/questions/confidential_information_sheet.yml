---
id: employer email
generic object: ALIndividual
question: Email for ${ x.employer.name.text }
fields:
  - Email: x.employer.email
    datatype: email
  - I don't know the email address: x.employer.email_unknown
    datatype: yesno
    disable others: True
validation code: |
  if x.employer.email_unknown:
    x.employer.email = "Unknown"
---
code: |
  case.case_name = petitioner.name.last + " v. " + respondent.name.last
---
objects:
  - confidential_information_sheet_attachment: DADict.using(object_type=ALDocument.using(has_addendum=True, default_overflow_message=AL_DEFAULT_OVERFLOW_MESSAGE), auto_gather=False, gathered=True)
---
id: confidential_information_sheet per-key document settings
code: |
  confidential_information_sheet_attachment[i].title = "Confidential Case Filing Information Sheet - Domestic Relations Cases"
  confidential_information_sheet_attachment[i].filename = "confidential_information_sheet" if i == "redacted" else "confidential_information_sheet_unredacted"
---
id: confidential_information_sheet overflow fields
code: |
  confidential_information_sheet_attachment[i].overflow_fields["children_of_marriage_minor"].overflow_trigger = 10
  confidential_information_sheet_attachment[i].overflow_fields["children_of_marriage_minor"].label = "Additional Minor Children"
  confidential_information_sheet_attachment[i].overflow_fields.gathered = True
---
attachment:
  variable name: confidential_information_sheet_attachment[i].addendum
  docx template file: confidential_information_sheet_attachment_addendum.docx
  redact: i == "redacted"
---
attachment:
  name: Confidential Case Filing Information Sheet - Domestic Relations Cases ${ "Redacted" if i == "redacted" else "Unredacted" }
  filename: confidential_information_sheet${ "" if i == "redacted" else "_unredacted" }
