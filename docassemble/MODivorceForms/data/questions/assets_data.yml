---
variable name: assets_starter
use objects: objects
data:
  object: DAObject
  module: docassemble.base.util
  items:
    - variable: real_estate
      name: real_estate
      display_name: real estate
      other_display: other real estate
      has_subtypes: True
      has_default_attributes: False
      may_have_loan: True
      may_split_award: True
      attributes:
        - object: DAObject
          item:
            field: x[i].source
            required: True
            example: House
            label: Type of asset
            datatype: code
            code: x.ordered
        - object: DAObject
          item:
            field: x[i].source_other
            required: True
            example: Cabin
            label: Other
            js show if: val('x[i].source') === "other"
            datatype: text
        - object: DAObject
          item:
            field: x[i].address
            required: False
            example: 123 Main St.
            label: Address 
        - object: DAObject
          item:
            field: x[i].legal_description
            required: False
            example: The back half of Lot 22.
            label: Legal description 
        - object: DAObject
          item:
            label: Is there an amount owed on this property?
            field: x[i].is_amount_owed
            datatype: yesnoradio
        - object: DAObject
          item:
            label: Who is the money owed to?
            field: x[i].lender
            required: False 
            show if: x[i].is_amount_owed
            example: First America
        - object: DAObject
          item:
            label: Balance
            field: x[i].balance
            datatype: currency
            show if: x[i].is_amount_owed
        - object: DAObject
          item:
            label: Monthly Payment
            field: x[i].monthly_payment
            datatype: currency
            show if: x[i].is_amount_owed
        - object: DAObject
          item:
            label: Who should pay this debt?
            field: x[i].recommended_debt
            show if: x[i].is_amount_owed
            datatype: code
            code: |
              ["petitioner", "respondent", "Split the debt"]
        - object: DAObject
          item:
            label: How much should users[0].name.full() pay?
            field: x[i].user_percentage_choice
            datatype: code
            code: |
              [{50: "50%"}, {75: "75%"}, {25: "25%"}, {"other": "Other"}]
            js show if: val('x[i].recommended_debt') === "Split the debt"
        - object: DAObject
          item:
            label: What percentage?
            field: x[i].user_percentage_other
            datatype: number
            min: 0
            max: 100
            js show if: val('x[i].user_percentage_choice') === "other"
        - object: DAObject
          item:
            label: Is this marital or nonmarital property?
            field: x[i].marital_property
            datatype: code
            code: |
              ["Marital", "Nonmarital", "Both"]
        - object: DAObject
          item:
            note: |
              ${ collapse_template(marital_property_template) }
        - object: DAObject
          item:
            label: Party with possession of this property?
            field: x[i].has_possession
            datatype: code
            code: |
              ["petitioner", "respondent", "Other"]
        - object: DAObject
          item:
            label: Recommended Award
            field: x[i].recommended_award             
            datatype: code
            code: |
              ["petitioner", "respondent", "Split the award"]
        - object: DAObject
          item:
            label: How much should users[0].name.full() receive?
            field: x[i].award_percentage_choice
            datatype: code
            code: |
              [{50: "50%"}, {75: "75%"}, {25: "25%"}, {"other": "Other"}]
            js show if: val('x[i].recommended_award') === "Split the award" 
        - object: DAObject
          item:
            label: What percentage?
            field: x[i].award_percentage_other
            datatype: number
            min: 0
            max: 100
            js show if: val('x[i].award_percentage_choice') === "other"
      terms_ordered: !!omap
        - house: "House"
        - condominium: "Condominium"
        - leasehold: "Leasehold"
        - other: "Other"
      description_code: |
        real_estate[i].display_name + space('real_estate[i].address', prefix=' at ', suffix='') + (" See attached legal description. " if real_estate[i].legal_description != "" else "")
      loan_description_code: |
        "Mortgage for " + real_estate[i].display_name + space('real_estate[i].address', prefix = " at ", suffix = "")
      security_description_code: |
        real_estate[i].display_name + space('real_estate[i].address', prefix=' at ', suffix='')
