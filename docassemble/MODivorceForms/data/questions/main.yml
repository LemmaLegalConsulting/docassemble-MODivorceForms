---
id: interview order certificate of dissolution of marriage
code: |
  # Set the allowed courts for this interview
  allowed_courts = []
  var_doc_dict_loaded
  nav.set_section("right_tool") 
  section_right_tool
  nav.set_section("relief") 
  section_relief
  section_case_information
  section_user_info
  section_other_party
  section_marriage
  section_children
  section_income
  section_expenses
  section_assets
  section_debts
  if len(set(var_doc_dict["form_14_calculations"]) & set(doc_list_selected.true_values())) > 0:
    form_14_calculations
  if len(set(var_doc_dict["use_presumed_child_support"]) & set(doc_list_selected.true_values())) > 0 and legal_custody != "Third Party" and physical_custody != "Third Party":
    use_presumed_child_support
  section_service
  interview_order_mo_divorce_forms = True
---
id: right tool interview order
code: |  
  ## 1 Is this the appropriate tool?
  if case_type == "Custody":
    custody_exit
  if marriage.can_be_preserved or not marriage.is_broken:
    legal_separation_exit
  if users[0].in_bankruptcy or other_parties[0].in_bankruptcy:
    bankruptcy_kickout
  children
  if child_outside_marriage:
    child_outside_marriage_exit
  if minor_children_before_marriage:
    minor_children_before_marriage_information

  if case.filed == "unknown":
    how_to_find_your_case
    reconsider('case.filed')
  if is_case_contested in ['contested','unknown']:
    mediation_info
  users[0].address.address
  if case.filed in ["user0_filed", "not_filed"]:
    if users[0].lives_in_missouri:
      users[0].county_length_of_residence_choice
      users[0].mo_length_of_residence_choice
  other_parties[0].address.address
  if case.filed in ["user0_filed", "not_filed"]:
    if other_parties[0].lives_in_missouri:
      other_parties[0].county_length_of_residence_choice
      other_parties[0].mo_length_of_residence_choice
  if case.filed in ["not_filed"]:
    if petitioner.lives_in_missouri and (petitioner.mo_length_of_residence_choice != "less_than_4" or petitioner.mo_length_of_residence_days >= 90):
      if not respondent.lives_in_missouri and not marriage.live_together_in_mo:
        personal_jurisdiction_warning
    elif not (respondent.lives_in_missouri and (respondent.mo_length_of_residence_choice != "less_than_4" or respondent.mo_length_of_residence_days >= 90)):
      jurisdiction_kickout  
  elif case.filed in ["other_parties0_filed"]:
    if petitioner.lives_in_missouri and petitioner.resident_for_90_days :
      if not (respondent.lives_in_missouri and respondent.resident_for_90_days) and not marriage.live_together_in_mo:
        respondent_personal_jurisdiction_warning
    elif not (respondent.lives_in_missouri and respondent.resident_for_90_days):
      if not waive_jurisdiction:
        respondent_jurisdiction_kickout  
  section_right_tool = True
---
id: relief interview order
code: |  

  users.gather()
  doc_list_selected
  doc_list_dictionary
  if len(set(var_doc_dict["relief"]) & set(doc_list_selected.true_values())) > 0:
    relief['custody']
    relief['change_name']
    relief['divide_property']
    relief['other']
  

  section_relief = True
---
id: case information interview order
code: |    
  ## 3 Please enter your case information
  nav.set_section("case_information")   
  if case.filed in ["user0_filed", "other_parties0_filed"]:
    use_case_net_for_online_docket
  if len(set(var_doc_dict["case.county"]) & set(doc_list_selected.true_values())) > 0:
    case.county # property_statement, petition, notice_of_hearing, form_17, certificate_of_dissolution
    case.court_name
    case.circuit 
  if defined('case.photo_filename'):
    case.photo.filename
  if case.filed in ["user0_filed", "other_parties0_filed"]:
    if len(set(var_doc_dict["previous_petitions"]) & set(doc_list_selected.true_values())) > 0:
      previous_petitions # answer, petition
    if len(set(var_doc_dict["case.docket_number"]) & set(doc_list_selected.true_values())) > 0:
      case.docket_number_asked
    if len(set(var_doc_dict["case.name_asked"]) & set(doc_list_selected.true_values())) > 0:
      case.name_asked
    if len(set(var_doc_dict["case.judge_asked"]) & set(doc_list_selected.true_values())) > 0:
      case.judge_asked
    if len(set(var_doc_dict["case.filing_date_asked"]) & set(doc_list_selected.true_values())) > 0:
      case.filing_date_asked # petition
    if len(set(var_doc_dict["notice_date"]) & set(doc_list_selected.true_values())) > 0:
      notice_date # property_statement.yml
  if len(set(var_doc_dict["case.matter_type"]) & set(doc_list_selected.true_values())) > 0:
    case.matter_type_asked # notice_of_hearing
  if petitioner.attorney_involved: # petition, notice_of_hearing
    petitioner.attorney.name.first # petition
  if petitioner.attorney_involved:
    petitioner.attorney.party_type_code # confidential_information_sheet
  petitioner.party_type_description
  if respondent.attorney_involved:
    respondent.attorney.name.first
    respondent.attorney.party_type_code
  respondent.party_type_code # confidential_information_sheet
  respondent.party_type_description  
  case.type_code
  section_case_information = True
---
id: user info interview order
code: |    
  nav.set_section("user_info")  
  users.gather()
  if users[0].has_prior_name:
    users[0].prior_name.name.first
  users[0].address.address # petition
  users[0].address.county
  if users[0].address.state == "MO":
    users[0].mo_length_of_residence_choice
  users[0].address.country
  if 'petition_attachment' in doc_list_selected.true_values():
    users[0].county_length_of_residence_choice
  users[0].email
  users[0].phone_number
  if len(set(var_doc_dict["users_birthdate"]) & set(doc_list_selected.true_values())) > 0:
    users[0].birthdate
  if len(set(var_doc_dict["users_ssn"]) & set(doc_list_selected.true_values())) > 0:
    users[0].ssn
  if 'confidential_information_sheet_attachment' in doc_list_selected.true_values():
    users[0].gender # confidential_information_sheet
  users[0].pronouns
  if 'certificate_of_dissolution_attachment' in doc_list_selected.true_values():
    users[0].race # certificate_of_dissolution
    users[0].education_info
    users[0].previously_married
    users[0].active_duty
  if 'answer_attachment' in doc_list_selected.true_values() and users[0].active_duty:
    if not waive_rights:
      active_duty_warning
  section_user_info = True
---
id: other party info interview order
code: |    
  other_parties.gather()
  if other_parties[0].has_prior_name:
    other_parties[0].prior_name.name.first
  nav.set_section("other_party_info")  
  other_parties[0].address.address # petition
  if other_parties[0].address.state == "MO":
    other_parties[0].address.county
  # other_parties[0].address.country
  if 'petition_attachment' in doc_list_selected.true_values():
    other_parties[0].mo_length_of_residence_choice
    other_parties[0].county_length_of_residence_choice
  if 'confidential_information_sheet_attachment' in doc_list_selected.true_values():
    other_parties[0].gender # confidential_information_sheet
  other_parties[0].pronouns
  other_parties[0].email
  other_parties[0].phone_number
  if len(set(var_doc_dict["users_birthdate"]) & set(doc_list_selected.true_values())) > 0:
    other_parties[0].birthdate
  if len(set(var_doc_dict["users_ssn"]) & set(doc_list_selected.true_values())) > 0:
    other_parties[0].ssn
  if 'certificate_of_dissolution_attachment' in doc_list_selected.true_values():
    other_parties[0].race # certificate_of_dissolution
    other_parties[0].education_info
    other_parties[0].previously_married
  if len(set(var_doc_dict["other_parties_active_duty"]) & set(doc_list_selected.true_values())) > 0:
    other_parties[0].active_duty
  section_other_party = True
---
id: marriage interview order
code: |  
  nav.set_section('marriage')
  
  if len(set(var_doc_dict["marriage_info"]) & set(doc_list_selected.true_values())) > 0:
    marriage_info # certificate_of dissolution
    marriage.address.county # petition
    marriage.address.country
    marriage.address.state
    marriage.recorded_date
  if 'petition_attachment' in doc_list_selected.true_values():
    if not respondent.address.state == "MO":
      marriage.live_together_in_mo
  if len(set(var_doc_dict["marriage.separation_date"]) & set(doc_list_selected.true_values())) > 0:
    marriage.separation_date

  if 'petition_attachment' in doc_list_selected.true_values():
    if other_allegations_exist:
      other_allegations # petition
  
  section_marriage = True
---
id: children interview order
code: |  
  nav.set_section("children")

  ## We want to ask about legal custody first, if needed.
  
  if minor_children and len(set(var_doc_dict["legal_custody"]) & set(doc_list_selected.true_values())) > 0:
    presumption_video
    if legal_custody in ["petitioner","respondent"]:
      legal_custody_sole_explanation
    elif legal_custody == "Third Party":
      third_party_custody_warning

    if legal_custody != "Third Party" and physical_custody in ["petitioner","respondent"] and visitation:
      visitation_supervisor.name.first
    elif legal_custody != "Third Party" and physical_custody == "Third Party":
      third_party_custody_warning

  if minor_children and len(set(var_doc_dict["children"]) & set(doc_list_selected.true_values())) > 0:
    nav.set_section("children")
    children.gather()
    if len(set(var_doc_dict["persons_lived_with"]) & set(doc_list_selected.true_values())) > 0:
      persons_lived_with_preload # petition
      persons_lived_with.gather()
  if len(set(var_doc_dict["children_number"]) & set(doc_list_selected.true_values())) > 0:
    number_of_children

  if len(set(var_doc_dict["relief"]) & set(doc_list_selected.true_values())) > 0:
    relief['child_support']
  child_support
  if minor_children and len(set(var_doc_dict["legal_custody"]) & set(doc_list_selected.true_values())) > 0 and legal_custody != "Third Party" and physical_custody != "Third Party":
    if parenting_plan_A_author["Other"]:
      parenting_plan_A_author_other.name.first
    if communications["third_party"]:
      communications_other.name.first
    phone_contact
    vacation
    location_of_exchange

    if case.filed in ['user0_filed','other_parties0_filed','not_filed']:
      exchanges.gather()
      biweekly_schedule_review
      visitation_nights
      if not holidays_default:
        for key in holidays.keys():
          if holidays[key]['different']:
            holidays[key]['even_years']
      holidays_review
      other_holidays.gather()
      role_dictionary_full_name
    elif case.filed in ['other_parties0_filed']:
      if not agree_with_parenting_plan:
        exchanges.gather()
        biweekly_schedule_review
        if not holidays_default:
          for key in holidays.keys():
            if holidays[key]['different']:
              holidays[key]['even_years']
        holidays_review
        other_holidays.gather()
        role_dictionary_full_name
  
    ask_about_dispute_resolution
    domestic_violence
  
    if child_support != "none": # certificate_of_dissolution
      child_support_method_of_payment
      child_support_start_date

    medical_insurance
    dental_insurance
    health_expenses_not_covered
  
  if len(set(var_doc_dict["pay_work_childcare_expenses"]) & set(doc_list_selected.true_values())) > 0:
    users[0].health_insurance_costs
    pay_work_childcare_expenses 
    users[0].work_childcare_expenses
    users[0].extraordinary_medical_costs.gather()
    users[0].extraordinary_childrearing_costs.gather()
    other_parties[0].health_insurance_costs
    other_parties[0].work_childcare_expenses
    other_parties[0].extraordinary_medical_costs.gather()
    other_parties[0].extraordinary_childrearing_costs.gather()

    if len(set(var_doc_dict["relief"]) & set(doc_list_selected.true_values())) > 0:
      relief['maintenance']
    is_maintenance_currently_paid
  if 'answer_attachment' in doc_list_selected.true_values():
    denials_exist

  if minor_children and len(set(var_doc_dict["marriage_info"]) & set(doc_list_selected.true_values())) > 0:
  #    # if others_with_physical_custody or other_custody_proceeding or other_litigation or abuse_or_neglect: # form_17
  #      related_case_explanation
    additional_children_information
    if abuse_or_neglect or other_custody_proceeding or other_litigation or others_with_physical_custody:
      children_explanation
    family_support_order
  section_children = True
---
code: |    
  nav.set_section('income')
  if len(set(var_doc_dict["user_jobs"]) & set(doc_list_selected.true_values())) > 0:
    users[0].jobs.gather() # income_statement.yml, fee_waiver, form_17
    if users[0].jobs.there_are_any or users[0].has_self_employment_income: # form_17
      users[0].employer.name.text
      users[0].employer.email # confidential information sheet order
      users[0].employer.address.address
    users[0].jobs.total(times_per_year = 12)
    users[0].has_self_employment_income
    users[0].benefits.gather()
    if len(users[0].benefits) > 0:
      users[0].benefits.review_items
    users[0].other_incomes.gather()
    if len(users[0].other_incomes) > 0:
      users[0].other_incomes.review_items
    users[0].maintenance_other_received
    users[0].other_children
    users[0].other_child_support_received
    users[0].monthly_gross_income # property_statement
    if len(set(var_doc_dict["user_self_supporting"]) & set(doc_list_selected.true_values())) > 0:
      users[0].self_supporting # property_statement
    other_parties[0].jobs.gather() # income_statement.yml, fee_waiver, form_17
    if other_parties[0].jobs.there_are_any or other_parties[0].has_self_employment_income: # form_17
      other_parties[0].employer.name.text
      other_parties[0].employer.email # confidential information sheet order
      other_parties[0].employer.address.address
      if case.filed in ["user0_filed"]:   
        other_parties[0].hours_of_employment
    other_parties[0].jobs.total(times_per_year = 12)
    other_parties[0].has_self_employment_income
    other_parties[0].benefits.gather()
    if len(other_parties[0].benefits) > 0:
      other_parties[0].benefits.review_items
    other_parties[0].other_incomes.gather()
    if len(other_parties[0].other_incomes) > 0:
      other_parties[0].other_incomes.review_items
    other_parties[0].maintenance_other_received
    other_parties[0].other_children
    other_parties[0].other_child_support_received
    other_parties[0].monthly_gross_income # property_statement
    if len(set(var_doc_dict["user_self_supporting"]) & set(doc_list_selected.true_values())) > 0:
      other_parties[0].self_supporting # property_statement
  section_income = True
