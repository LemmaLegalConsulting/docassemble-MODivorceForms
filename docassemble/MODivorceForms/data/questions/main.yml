subquestion: |
  Here are the documents you need as a ${ "Petitioner" if case.filed in ["user0_filed","not_filed"] else "Respondent" } in a ${ "Dissolution of Marriage with Children" if minor_children else "Dissolution of Marriage without Children"  }.

  % if case.filed in ["user0_filed","not_filed"]:
  "Petitioner" means the person who starts the case by filing a petition.  The other person is the "Respondent".
  % else:
  "Respondent" means the person who is responding to the person who started the case, called the "Petitioner".
