  Documents are filed with the Circuit Clerk’s office.
  
  Be prepared to pay a filing fee [even if you are filing a Motion to Proceed as a Poor Person].
  
  After you file, you will receive a letter in the mail from the court with your assigned case number and first court date.
  
  % if minor_children:
  Check your local court rules to find if your county requires a specific parenting class. If not, go to [courseforparents.com](https://courseforparents.com/) or [Focus on Kids](https://extension.missouri.edu/programs/focus-on-kids)
  
