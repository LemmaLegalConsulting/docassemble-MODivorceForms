id: Personal Service Information Screen
question:  In Person Service
subquestion: |
  Your spouse can be served:

  * Where they’re staying;
  * Where they work; or
  * Anywhere they might be (e.g. a friend or family member's house, a bar, or at a court date.)

  ## By Sheriff
  
  Standard method of service and most cost-effective option.

  ## By Process Server
  
  If the Sheriff is not able to serve your spouse, a special process server is another option. You may need to file a motion with the court for permission to use a special process server. 
  
  Visit [NAPPS.ORG](https://napps.org/) to find a special process server in your area.
  
  Check your local court rules for more information and rules for appointing a special process server.
continue button field: personal_service_information
