    datatype: yesnoradio
    js show if:   |
      val("minor_children") === true 
  - note: |
       Sometimes when a child is born to two people before they get married, the court will require a separate case to establish paternity (even if everybody agrees).  However, most courts will move forward with just the divorce, assuming that paternity is acknowledged through the marriage.  For now, we'll move forward with the understanding that the paternity has been acknowledged.  However, a judge may direct you to file something else or speak to an attorney.
    js show if:   |
      val("minor_children_before_marriage") === true
  - Have you or your spouse physically given birth to a child with another partner during your marriage?: child_outside_marriage
    datatype: yesnoradio
    js show if:   |
      val("minor_children") === false || val("minor_children_before_marriage") === true || val("minor_children_before_marriage") === false
  - note: |
      Missouri law automatically assumes that the husband is the father of the child unless a separate case is filed establishing paternity of the biological father and non-paternity of the husband, even if the biological father is the one on the birth certificate.  It would be in your best interest to [find an attorney](https://www.courts.mo.gov/page.jsp?id=611).  
    js show if:   |
      val("child_outside_marriage") === true
  - Are you or your spouse currently pregnant?: pregnant
    datatype: yesnoradio
    js show if:   |
      val("child_outside_marriage") === true || val("child_outside_marriage") === false
