code: |
  temp_doc_list_options = list()
  temp_doc_list_info = list()
  if  case.filed in ["user0_filed","not_filed","unknown"]:
    temp_doc_list_options.append({'petition_attachment':'Petition','default':True}) 
    
  elif case.filed == "other_parties0_filed":
    temp_doc_list_options.append({'value':'answer_attachment','label':'Answer','default':True})   
  
  temp_doc_list_options.append({'value':'notice_of_hearing_attachment','label':'Notice of hearing','default':True})   
  if  case.filed in ["user0_filed","other_parties0_filed","not_filed","unknown"]:
    temp_doc_list_options.append({'value':'certificate_of_dissolution_attachment', 'label':'Certificate of Dissolution', 'default':True})   
  if  case.filed in ["user0_filed","not_filed","unknown"]:
    temp_doc_list_options.append({'value':'judgment_attachment','label':'Judgment','default':True})   
  temp_doc_list_options.append({'value':'property_statement_attachment','label':'Property statement','default':True})     
  temp_doc_list_options.append({'value':'income_statement_attachment','label':'Income statement','default':True})    
  if  case.filed in ["user0_filed","not_filed","jointly_filed","unknown"]:
    temp_doc_list_options.append({'value':'fee_waiver_attachment','label':'Fee waiver','default':True})
  temp_doc_list_options.append({'value':'confidential_information_sheet_attachment','label':'Confidential information sheet','default':True})   
  temp_doc_list_options.append({'value':'redaction_certification_attachment','label':'Redaction certification','default':True})   
  if minor_children:
    temp_doc_list_options.append({'value':'parenting_plan_attachment', 'label':'Parenting Plan', 'default':True})   
    temp_doc_list_options.append({'value':'form_14_attachment', 'label':'Form 14 only', 'default':False})   
  doc_list_options = temp_doc_list_options
---
variable name: doc_list_options
use objects: True
data: 
  - label: Confidential Case Filing Information Sheet 
    value: confidential_information_sheet_attachment
    default: True
    help: |
       This confidential document is required and used to open a case in the courts' case management system. 
  - label: Petition
    value: petition_attachment
    default: True
    help: |
       This **required document** starts your divorce within the court system. It informs the court what you are asking for - a legal divorce, and anything else including: child custody, child support, restoring your maiden name, etc.
  - label: Answer
    value: answer_attachment
    default: ${ case.filed == "other_parties_filed"}
    help: |
       This required document is a written response to your spouse's Petition for Dissolution of Marriage. This should be completed even if you agree on everything.
  - label: Certificate of Dissolution of Marriage
    value: certificate_of_dissolution_attachment
    default: True
    help: |
       This required document is to be filled out by you and will be signed by the court when your divorce is final. It will be sent by the court to the county where you were married and will be put together with your marriage certificate for county record keeping.
  - label: Statement of Income and Expenses
    value: income_statement_attachment
    default: True
    help: |
       This required document gives the court an idea of your total income and expenses from both you and your spouse to determine division of property and debts as well as maintenance (formerly known as alimony), and child support, if appropriate.
  - label: Statement of Property and Debt 
    value: property_statement_attachment
    default: True
    help: |
      This required document lists all property & debt currently owned by you or your spouse. This includes property and debt you owned before the marriage, acquired separately, and together. The court uses this document to  determine a fair division of property and debt.
  - label: Judgment and Decree of Dissolution of Marriage
    value: judgment_attachment
    default: True
    help: |
       This document is only for cases wherein both you and your spouse are in agreement on how everything will be divided. If accepted, the judge will sign this document, formally dissolving your marriage.
  - label: Parenting Plan
    value: parenting_plan_attachment
    default: True
    help: |
       This document outlines a specific plan for: custody, parenting time, decision making regarding the child/ren, and child support. This document is required if you and your spouse have children together.
  - label: Notice of hearing
    value: notice_of_hearing_attachment
    default: True
    help: |
       This document will be completed by the court, providing the date of your hearing - where you will both be required to attend court.
  - label: Answer
    value: answer_attachment
    default: True
    help: |
       This required document is a written response to your spouse's Petition for Dissolution of Marriage. This should be completed even if you agree on everything.
  - label: Redaction Certification
    value: redaction_certification_attachment
    default: True
    help: |
       This required document acknowledges that you have redacted (or "removed") the necessary confidential information from all of your filings, pursuant to Rules 19.10, 55.025, or 84.15.
  - label: Fee Waiver
    value: fee_waiver_attachment
    default: ${ case.filed in ["user0_filed","not_filed","unknown"] }
    help: |
       You may ask the court to waive the fees if you believe you are unable to pay them. This fee waiver will tell the court of your income and expenses, under oath, and the judge will decide whether the fees will be waived.
  - label: Form 14 only
    value: form_14_attachment
    default: False
    help: |
       Form 14 is a worksheet to determine child support and is included in the Parenting Plan. Only select this if you want to complete a Form 14 without the rest of the Parenting Plan.
---
id: document choice
