id: assets interview code
code: |     
  nav.set_section('assets')  
  if len(set(var_doc_dict["user_cash"]) & set(doc_list_selected.true_values())) > 0:
    users[0].cash
  if len(set(var_doc_dict["real_estate"]) & set(doc_list_selected.true_values())) > 0:
    real_estate.gather() # property_statement, fee_waiver
    if len(real_estate.matches(source=['house'])) > 0:
