id: Welcome
question: Missouri Divorce Forms
fields:
  - What issue are you looking for help with?:  case_type
    datatype: radio
    choices:
      - "Divorce (this includes child custody and support)": Divorce
      - "Child Custody and Support (for parents who are not married)": Custody
  - note: |
      This tool can help with a divorce.  A divorce in Missouri requires that a marriage is irreparably broken and a marriage cannot be preserved.
    show if: 
      variable: case_type
      is: Divorce
  - Is your marriage irreparably broken?: marriage.is_broken
    datatype: yesnoradio
    default: True
    show if: 
      variable: case_type
      is: Divorce
  - Can your marriage be preserved?: marriage.can_be_preserved
    datatype: yesnoradio
    default: False
    show if: 
      variable: case_type
      is: Divorce
