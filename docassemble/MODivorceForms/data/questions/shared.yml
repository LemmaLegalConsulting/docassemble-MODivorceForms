  included_in_form14: "The work-related child care costs will be included in the child support calculation on the Form 14."
  pay_own: "Each parent will pay their own reasonable work-related child care expenses related to his or her employment."
  pay_percentage: support_payer.name_full() + " shall partially reimburse " + support_recipient.name_full() + " for all reasonable work-related child care expenses."
