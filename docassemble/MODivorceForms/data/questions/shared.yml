id: real_estate object
objects:
  - real_estate: ALAssetList.using(complete_attribute='complete')
---
id: real_estate there is anotehre
code: |
  real_estate.there_is_another = False
---
id: real_estate terms_ordered
# "!!omap" makes these terms ordered
# their order here will be their same order when shown to users.
variable name: real_estate.terms_ordered
data: !!omap
  - house: "House"
  - condominium: "Condominium"
  - leasehold: "Leasehold"
  - other: "Other"
---
id: real_estate other display test
comment: |
  This keeps the text that may be changed near the top of the section.
  Used in:
  Tell us about your ______
code: |
  real_estate.other_display = "other real estate"
  real_estate.display_name = "real estate"
---
only sets: 
  - real_estate[i].market_value
  - real_estate[i].recommended_debt
id: describe real_estate
reconsider: real_estate[i].display_name
question: |
  Tell us about your ${ real_estate[i].display_name }
subquestion: |

  Make your best guess for the market value.
  
  % if i > 1:
  You have already told us about your ${ comma_and_list(asset.display_name for asset in real_estate.complete_elements()) }.
  % elif i > 0:
  You have already told us about your ${ comma_and_list(asset.display_name for asset in real_estate.complete_elements()) }.
  % endif
fields:
  - Type of asset: real_estate[i].source
    code: |
      real_estate.ordered
  - Other (explain): real_estate[i].source_other
    show if:
      variable: real_estate[i].source
      is: other
  - Address: real_estate[i].address
    required: False
  - Legal description: real_estate[i].legal_description
    required: False
  - What is its market value? How much would you get if you sold it?: real_estate[i].market_value
    maxlength: 76
    datatype: currency
  - Is there an amount owed on this property?: real_estate[i].is_amount_owed
    datatype: yesnoradio
  - Who is the money owed to?: real_estate[i].lender
    required: False 
    show if: real_estate[i].is_amount_owed
  - Balance: real_estate[i].balance
    datatype: currency
    show if: real_estate[i].is_amount_owed
  - Monthly Payment: real_estate[i].monthly_payment
    datatype: currency
    show if: real_estate[i].is_amount_owed
  - Who should pay this debt?: real_estate[i].recommended_debt
    show if: real_estate[i].is_amount_owed
    choices:
      - ${ petitioner.name.full() }
      - ${ respondent.name.full() }
      - Split the debt: split
  - How much should ${ users[0].name.full() } pay?: real_estate[i].user_percentage_choice
    choices:
      - "50%": 50
      - "75%": 75
      - "25%": 25
      - Other: other
    show if:
      variable: real_estate[i].recommended_debt
      is: split
  - What percentage?: real_estate[i].user_percentage_other
    datatype: number
    min: 0
    max: 100
    show if:
      variable: real_estate[i].user_percentage_choice
      is: other
  - Is this marital or nonmarital property?: real_estate[i].marital_property
    choices:
      - Marital
      - Nonmarital
      - Both
  - note: |
      ${ collapse_template(marital_property_template) }
  - Whose name is on the title?: real_estate[i].title
    choices:
      - ${ petitioner.name.full() } 
      - ${ respondent.name.full() }
      - ${ petitioner.name.full() } + ${ respondent.name.full() }
      - Other: other
  - Who is living in the ${ real_estate[i].display_name } ?: real_estate[i].has_possession
    choices:
      - ${ petitioner.name.full() } 
      - ${ respondent.name.full() }
      - Other: other
  - Who do you think the house should go to?: real_estate[i].recommended_award
    choices:
      - ${ petitioner.name.full() }
      - ${ respondent.name.full() }
      - Other: other
      - Split the award: split
  - "How much should ${ users[0].name.full() } get?": real_estate[i].award_percentage_choice
    choices:
      - "50%": 50
      - "75%": 75
      - "25%": 25
      - Other: other
    show if:
      variable: real_estate[i].recommended_award
      is: split
  - What percentage?: real_estate[i].award_percentage_other
    datatype: number
    min: 0
    max: 100
    show if:
      variable: real_estate[i].award_percentage_choice
      is: other
validation code: |
  if real_estate[i].source != "other":
    real_estate[i].display_name = real_estate.terms_ordered.get(real_estate[i].source, real_estate[i].source)
  else:
    real_estate[i].display_name = real_estate[i].source_other
  if real_estate[i].recommended_award == "split" and real_estate[i].award_percentage_choice == "other" and users[0].name.full() == petitioner.name.full():
    real_estate[i].award_percentage_petitioner = real_estate[i].award_percentage_other/100
    real_estate[i].award_percentage_respondent = 1- real_estate[i].award_percentage_other/100
  elif real_estate[i].recommended_award == "split" and users[0].name.full() == petitioner.name.full():
    real_estate[i].award_percentage_petitioner = float(real_estate[i].award_percentage_choice)/100
    real_estate[i].award_percentage_respondent = 1- float(real_estate[i].award_percentage_choice)/100
  elif real_estate[i].recommended_award == "split" and real_estate[i].award_percentage_choice == "other" and users[0].name.full() == respondent.name.full():
    real_estate[i].award_percentage_respondent = real_estate[i].award_percentage_other/100
    real_estate[i].award_percentage_petitioner = 1- real_estate[i].award_percentage_other/100
  elif real_estate[i].recommended_award == "split" and users[0].name.full() == respondent.name.full():
    real_estate[i].award_percentage_respondent = float(real_estate[i].award_percentage_choice)/100
    real_estate[i].award_percentage_petitioner = 1- float(real_estate[i].award_percentage_choice)/100
  else:
    real_estate[i].award_percentage_petitioner = None
    real_estate[i].award_percentage_respondent = None
  if real_estate[i].is_amount_owed and real_estate[i].recommended_debt == "split" and real_estate[i].user_percentage_choice == "other" and users[0].name.full() == petitioner.name.full():
    real_estate[i].petitioner_debt_percentage = real_estate[i].user_percentage_other/100
    real_estate[i].respondent_debt_percentage = 1 - real_estate[i].user_percentage_other/100
  elif real_estate[i].is_amount_owed and real_estate[i].recommended_debt == "split" and users[0].name.full() == petitioner.name.full():
    real_estate[i].petitioner_debt_percentage = float(real_estate[i].user_percentage_choice)/100
    real_estate[i].respondent_debt_percentage = 1 - float(real_estate[i].user_percentage_choice)/100
  elif real_estate[i].is_amount_owed and real_estate[i].recommended_debt == "split" and real_estate[i].user_percentage_choice == "other" and users[0].name.full() == respondent.name.full():
    real_estate[i].respondent_debt_percentage = real_estate[i].user_percentage_other/100
    real_estate[i].petitioner_debt_percentage = 1 - real_estate[i].user_percentage_other/100
  elif real_estate[i].is_amount_owed and real_estate[i].recommended_debt == "split" and users[0].name.full() == respondent.name.full():
    real_estate[i].respondent_debt_percentage = float(real_estate[i].user_percentage_choice)/100
    real_estate[i].petitioner_debt_percentage = 1 - float(real_estate[i].user_percentage_choice)/100
  else:
    real_estate[i].petitioner_debt_percentage = None
    real_estate[i].respondent_debt_percentage = None
  real_estate[i].ownership = real_estate[i].title
