      is: less_than_4
  - How many months?: x.mo_length_of_residence_months
    datatype: integer
    min: 4
    max: 11
    show if:
      variable: x.mo_length_of_residence_choice
      is: more_than_4
  - How many years?: x.mo_length_of_residence_years
    datatype: integer
    show if:
      variable: x.mo_length_of_residence_choice
      is: year    
  - How long ${ "have you" if x.instanceName == "users[0]" else "has your spouse" } lived in ${ x.address.county }?: x.county_length_of_residence_choice
    datatype: radio
    choices:
      - Less than 4 months: less_than_4
      - More than 4 months but less than a year: more_than_4
      - A year or more: year
    js show if: |
      val("x.mo_length_of_residence_days") > 0 || val("x.mo_length_of_residence_months") > 0 || val("x.mo_length_of_residence_years") > 0
  - How many days?: x.county_length_of_residence_days
    datatype: integer
    show if:
      variable: x.county_length_of_residence_choice
      is: less_than_4
  - How many months?: x.county_length_of_residence_months
    datatype: integer
    min: 4
    max: 11
    show if:
      variable: x.county_length_of_residence_choice
      is: more_than_4
  - How many years?: x.county_length_of_residence_years
    datatype: integer
    show if:
      variable: x.county_length_of_residence_choice
      is: year
validation code: |
  if x.county_length_of_residence_choice == 'less_than_4':
    if x.mo_length_of_residence_choice == 'less_than_4':
      if x.county_length_of_residence_days > x.mo_length_of_residence_days:
        validation_error("Your residency in Missouri must be at least as long as your residency in a Missouri county.")
  elif x.county_length_of_residence_choice == 'more_than_4':
    if x.mo_length_of_residence_choice == 'less_than_4':
      validation_error("Your residency in Missouri must be at least as long as your residency in a Missouri county.")
    elif x.mo_length_of_residence_choice == 'more_than_4':
      if x.county_length_of_residence_months > x.mo_length_of_residence_months:
        validation_error("Your residency in Missouri must be at least as long as your residency in a Missouri county.")
  elif x.county_length_of_residence_choice == 'year':
    if x.mo_length_of_residence_choice == 'less_than_4' or x.mo_length_of_residence_choice == 'more_than_4':
      validation_error("Your residency in Missouri must be at least as long as your residency in a Missouri county.")
    else:
      if x.county_length_of_residence_years > x.mo_length_of_residence_years:
        validation_error("Your residency in Missouri must be at least as long as your residency in a Missouri county.")
  if x.mo_length_of_residence_choice != "less_than_4" or x.mo_length_of_residence_days >= 90:
    x.resident_for_90_days = True
  else:
    x.resident_for_90_days = False
  if x.county_length_of_residence_choice != "less_than_4" or x.county_length_of_residence_days >= 90:
    x.county_resident_for_90_days = False
  else:
    x.county_resident_for_90_days = True
