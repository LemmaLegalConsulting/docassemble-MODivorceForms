id: list of previously entered people
code: |
  temp_people_choices = list()
  temp_people_choices.append(users[0])
  temp_people_choices.append(other_parties[0])
  if defined('legal_custody_other') and hasattr(legal_custody_other.name,"first"):
    temp_people_choices.append(legal_custody_other)
  if defined('parenting_plan_A_author_other') and hasattr(parenting_plan_A_author_other.name, "first"):
    temp_people_choices.append(parenting_plan_A_author_other)
  if defined('physical_custody_other') and hasattr(physical_custody_other.name,"first"):
    temp_people_choices.append(physical_custody_other)
  if defined('visitation_supervisor') and hasattr(visitation_supervisor.name,"first"):
    temp_people_choices.append(visitation_supervisor)
  if defined('communications_other') and hasattr(communications_other.name,"first"):
    temp_people_choices.append(communications_other)
  if defined('children'):
    for child in children.complete_elements():
      if defined('child.other_parent.name.first'):
        temp_people_choices.append(child.other_parent)
      if defined('child.birth_certificate_other.name.first'):
        temp_people_choices.append(child.birth_certificate_other)
  if defined('persons_lived_with'):
    for person in persons_lived_with.complete_elements():
      if person != users[0] and person != other_parties[0]:
        temp_people_choices.append(person)
  parent_and_people_choices = temp_people_choices
---
id: list of previously entered people without parents
code: |
  temp_people_choices = list()
  if hasattr(legal_custody_other.name,"first"):
    temp_people_choices.append(legal_custody_other)
  if hasattr(physical_custody_other.name,"first"):
    temp_people_choices.append(physical_custody_other)
  if defined('parenting_plan_A_author_other') and hasattr(parenting_plan_A_author_other.name, "first"):
    temp_people_choices.append(parenting_plan_A_author_other)
  if hasattr(visitation_supervisor.name,"first"):
    temp_people_choices.append(visitation_supervisor)
  if hasattr(communications_other.name,"first"):
    temp_people_choices.append(communications_other)
  if defined('children'):
    for child in children.complete_elements():
      if defined('child.other_parent.name.first'):
        temp_people_choices.append(child.other_parent)
      if defined('child.birth_certificate_other.name.first'):
        temp_people_choices.append(child.birth_certificate_other)
  if defined('persons_lived_with'):
    for person in persons_lived_with:
      if person != users[0] and person != other_parties[0]:
        temp_people_choices.append(person)
  people_choices = temp_people_choices
