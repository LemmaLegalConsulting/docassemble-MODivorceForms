    % if users[0].employer.email_unknown:
    I don't know the email address for ${ users[0].name.text }
    % else:
    Email for ${ users[0].name.text }: **${ users[0].employer.email }**
    % endif
- note: |
    Your spouse's monthly gross income: **$${ thousands(other_parties[0].monthly_gross_income) }**

    % if other_parties[0].assumed_monthly_gross_income:
    You said you don't know about any source of income for your spouse, so we can assume that your spouse has an income based on minimum wage, working 40 hours per week.

    % endif
- Edit: 
    - other_parties[0].jobs.revisit
    - invalidate:
      - other_parties[0].employer.name.text
      - other_parties[0].employer.email 
      - other_parties[0].employer.address.address
      - other_parties[0].employer.address.unit
      - other_parties[0].employer.address.city
      - other_parties[0].employer.address.state
      - other_parties[0].employer.address.zip
      - other_parties[0].monthly_gross_income
    - recompute:
      - section_income
  show if: showifdef('doc_list_selected["fee_waiver_attachment"]') or showifdef('doc_list_selected["petition_attachment"]') or showifdef('doc_list_selected["income_statement_attachment"]') or showifdef('doc_list_selected["parenting_plan_attachment"]') or showifdef('doc_list_selected["form_14_attachment"]')
  button: |
    % if other_parties[0].jobs.there_are_any:
    Your spouse's monthly gross income from a job:  **$${ thousands(other_parties[0].jobs.total(times_per_year=12)) }**
    % elif other_parties[0].jobs.there_are_any == False:
    Your spouse has no income from a job.
    % elif other_parties[0].jobs.there_are_any == None:
    You don't know if your spouse has a job.
    % endif
- Edit: 
    - other_parties[0].has_self_employment_income
    - invalidate:
      - other_parties[0].employer.name.text
      - other_parties[0].employer.email 
      - other_parties[0].employer.address.address
      - other_parties[0].employer.address.unit
      - other_parties[0].employer.address.city
      - other_parties[0].employer.address.state
      - other_parties[0].employer.address.zip
      - other_parties[0].monthly_gross_income
    - recompute:
      - section_income
  show if: showifdef('doc_list_selected["fee_waiver_attachment"]') or showifdef('doc_list_selected["petition_attachment"]') or showifdef('doc_list_selected["income_statement_attachment"]') or showifdef('doc_list_selected["parenting_plan_attachment"]') or showifdef('doc_list_selected["form_14_attachment"]')
  button: |
    % if other_parties[0].has_self_employment_income == True:
    Your spouse's monthly gross income from self employment: **$${ thousands(other_parties[0].self_employment_income) }**
