## CASE ##
---
objects:
  - case: Thing
---
id: Your Court Case
question: Court Case
fields: 
  - Has your case already been filed?: case.filed
    datatype: radio
    choices:
      - Yes, I filed myself: user0_filed
      - Yes, my spouse filed: other_parties0_filed
      - Not yet: not_filed
      - I'm not sure: unknown
  - Has the case you filed been dismissed?: active_case
    datatype: noyesradio
    show if: 
      variable: case.filed
      is: user0_filed
  - note: |
      If the case has been dismissed, you will have to file a petition to start a new case.
    show if:
      variable: active_case
      is: False
validation code: |
  if defined('active_case') and not active_case:
    case.filed = "not_filed"
---
code: |
  if case.filed in ["user0_filed","not_filed"]:
    petitioner = users[0]
    respondent = other_parties[0]
    user_started_case = True
    if case.filed in ["not_filed"]:
      previous_petitions = 0
  elif case.filed == "other_parties0_filed":
    petitioner = other_parties[0]
    respondent = users[0]
    user_started_case = False
  else:
    previous_petitions = 0
    user_started_case = True
---
if: case.filed in ["other_parties0_filed"]
id: previous petitons
question: Has ${ petitioner.name.full() } filed any petitions before the one you are answering?
fields:
  - no label: previous_petitions
    choices:
      - No, I am answering the first petition: 1
      - Yes, ${ petitioner.name.full() } has filed once before this petition: 2
      - Yes, ${ petitioner.name.full() } has filed twice before this petition: 3
---
if: case.filed in ["user0_filed"]
id: number of previous petitions
question: Petitions Filed
fields:
  - How many petitions have you filed in this case?: previous_petitions
    datatype: integer
    min: 1
  - note: |
      If you have not filed any petitions yet, you need to change your [answer](${ url_action('case.filed') }) about whether the case has been filed.
    show if:
      variable: previous_petitions
      is: 0
---
code: |
  if minor_children:
    case.type_code = "DI"
  else:
    case.type_code = "DH"
---
comment: | 
