    "form_14_attachment" in doc_list_selected.true_values() or "parenting_plan_attachment" in doc_list_selected.true_values()
- Edit: use_presumed_child_support
  button: |
    **Presumed Child Support amount**

    % if number_of_children > 5:
     - Six or more children - ${ currency(support_payer.presumed_child_support_amount_12_6 if support_payer.presumed_child_support_amount_12_6 > 0 else 0 ) }
    
    % endif
    % if number_of_children > 4:
     - Five children - ${ currency(support_payer.presumed_child_support_amount_12_5 if support_payer.presumed_child_support_amount_12_5 > 0 else 0 ) }
    
    % endif
    % if number_of_children > 3:
     - Four children - ${ currency(support_payer.presumed_child_support_amount_12_4 if support_payer.presumed_child_support_amount_12_4 > 0 else 0 ) }
    
    % endif
    % if number_of_children > 2:
     - Three children - ${ currency(support_payer.presumed_child_support_amount_12_3 if support_payer.presumed_child_support_amount_12_3 > 0 else 0 ) }
    
    % endif
    % if number_of_children > 1:
     - Two children - ${ currency(support_payer.presumed_child_support_amount_12_2 if support_payer.presumed_child_support_amount_12_2 > 0 else 0 ) }
    
    % endif
     - One child - ${ currency(support_payer.presumed_child_support_amount_12 if support_payer.presumed_child_support_amount_12 > 0 else 0 ) }
    
    Should the court order this amount in monthly child support?: **${ showifdef('use_presumed_child_support') }**

    % if showifdef('use_presumed_child_support') == "no":
    Why is the presumed child support amount unjust and inappropriate?: ${ showifdef('use_presumed_child_support_explanation') }

    % if defined('actual_child_support_6'):
     - Six or more children: **$${ thousands(actual_child_support_6) }**
    % endif
    % if defined('actual_child_support_5'):
     - Five children: **$${ thousands(actual_child_support_5) }**
    % endif
    % if defined('actual_child_support_4'):
     - Four children: **$${ thousands(actual_child_support_4) }**
    % endif
    % if defined('actual_child_support_3'):
     - Three children: **$${ thousands(actual_child_support_3) }**
    % endif
    % if defined('actual_child_support_2'):
     - Two children: **$${ thousands(actual_child_support_2) }**
    % endif
    % if defined('actual_child_support_1'):
     - One child: **$${ thousands(actual_child_support_1) }**
    % endif
    
    % endif
