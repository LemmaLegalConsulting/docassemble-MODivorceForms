---
code: |
  if showifdef('doc_list_selected["answer_attachment"]') or showifdef('doc_list_selected["petition_attachment"]') or showifdef('doc_list_selected["judgment_attachment"]') or showifdef('doc_list_selected["parenting_plan_attachment"]') or showifdef('doc_list_selected["confidential_information_sheet_attachment"]'):
    children_of_marriage_minor = [chi for chi in children if chi.unemancipated and chi.parents[petitioner.name.full()] and chi.parents[respondent.name.full()]]
  if doc_list_selected['petition_attachment']:
    children_of_marriage = [chi for chi in children if chi.parents[petitioner.name.full()] and chi.parents[respondent.name.full()]]
    children_of_marriage_born_after_not_adopted = [chi for chi in children if chi.parents[petitioner.name.full()] and chi.parents[respondent.name.full()] and chi.birthdate >= marriage.recorded_date and not chi.adopted]
    children_of_marriage_born_before_not_adopted = [chi for chi in children if chi.parents[petitioner.name.full()] and chi.parents[respondent.name.full()] and chi.birthdate < marriage.recorded_date and not chi.adopted]
    children_of_marriage_adopted = [chi for chi in children if chi.parents[petitioner.name.full()] and chi.parents[respondent.name.full()] and chi.adopted]
  children_list_create = True
