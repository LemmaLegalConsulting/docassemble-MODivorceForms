  if debts[i].recommended_debt == "split" and debts[i].user_percentage_choice == "other" and users[0].name.full() == petitioner.name.full():
    debts[i].petitioner_debt_percentage = debts[i].user_percentage_other/100
    debts[i].respondent_debt_percentage = 1 - debts[i].user_percentage_other/100
  elif debts[i].recommended_debt == "split" and users[0].name.full() == petitioner.name.full():
    debts[i].petitioner_debt_percentage = float(debts[i].user_percentage_choice)/100
    debts[i].respondent_debt_percentage = 1 - float(debts[i].user_percentage_choice)/100
  elif debts[i].recommended_debt == "split" and debts[i].user_percentage_choice == "other" and users[0].name.full() == respondent.name.full():
    debts[i].respondent_debt_percentage = debts[i].user_percentage_other/100
    debts[i].petitioner_debt_percentage = 1 - debts[i].user_percentage_other/100
  elif debts[i].recommended_debt == "split" and users[0].name.full() == respondent.name.full():
    debts[i].respondent_debt_percentage = float(debts[i].user_percentage_choice)/100
    debts[i].petitioner_debt_percentage = 1 - float(debts[i].user_percentage_choice)/100
  else:
    debts[i].petitioner_debt_percentage = None
    debts[i].respondent_debt_percentage = None
  debts[i].security = "None"
  if debts[i].marital_property == "Nonmarital" and debts[i].recommended_debt != "split":
    debts[i].ownership = debts[i].recommended_debt 
  else:
    debts[i].ownership = petitioner.name.full() + " + " + respondent.name.full()
