############ REVIEW
id: review screen
reconsider: children_of_marriage_minor
event: review_form
question: Review your answers
subquestion: |
  Click the section headings to see and edit your answers.
review:
- raw html: |
    ${ start_accordion("Documents", showing=False) }
- edit:
    - doc_list_selected
    - undefine:
      - section_relief
      - section_case_information
      - section_user_info
      - section_other_party
      - section_marriage
      - section_children
      - section_income
      - section_expenses
      - section_assets
      - section_debts
      - section_service
      - form_14_calculations
    - invalidate:
      - use_presumed_child_support
    - recompute:
      - interview_order_mo_divorce_forms
  button: |
    You are producting the following documents:
    
    % for doc in doc_list_selected.true_values():
     - ${ doc_list_dictionary[doc] }
    
    % endfor
- raw html: |
    ${ next_accordion("Maintenance and other relief", showing=False) }
  show if: |
    showifdef('doc_list_selected["petition_attachment"]') or showifdef('doc_list_selected["answer_attachment"]')
- Edit: 
    - relief['maintenance']
    - recompute:
        - section_relief
  button: |
    **Maintenance award**

    Should the court award maintenance to ${ petitioner.name_full() } or ${ respondent.name_full() }?: **${ word(yesno(relief['maintenance'])) }**

    % if relief['maintenance']:
    Who should be awarded maintenance?: **${ petitioner.name.full() if maintenance_awarded_to == "petitioner" else respondent.name.full() }**

    How much?  **${ showifdef('maintenance_amount') }**
    
    Should the maintenance be subject to modification?  **${ word(yesno(showifdef('maintenance_modifiable'))) }**
    % endif
- Edit: maintenance_income_withholding
  button: |
    **Income Withholding**

    Should income withholding be prepared by the person receiving maintenance?: ${ word(yesno(maintenance_income_withholding)) }

    % if showifdef('maintenance_income_withholding') == "False":
    Reason income withholding shall not issue: ${ showifdef('maintenance_income_withholding_reason') }
    % endif
- Edit: relief['change_name']
  button: |
    % if showifdef('relief["change_name"]'):
    Do you want to change your name to your prior name?: ${ word(yesno(relief['change_name'])) }
    % endif

    Is there any other relief you want to request from the court?: ${ word(yesno(relief['other'])) }

    % if showifdef('relief["other"]'):
    Explain: ${ showifdef('relief_other') }
    % endif
- raw html: |
    ${ next_accordion("Answer", showing=False) }
  show if: showifdef('doc_list_selected["answer_attachment"]')
- Edit: agree_with_parenting_plan
  button: |
    Do you agree with the Parenting Plan filed by ${ petitioner }?:  **${ word(yesno(agree_with_parenting_plan)) }**
- Edit: denials_exist
  button: |
    Is there anything you disagree with on your spouse's Petition for Dissolution of Marriage?:  **${ word(yesno(denials_exist)) }**

    % if denials_exist:
    ${ denials }
    % endif
- raw html: |
    ${ next_accordion("Custody", showing=False) }
  show if: (showifdef('doc_list_selected["petition_attachment"]') and minor_children) or showifdef('doc_list_selected["parenting_plan_attachment"]')
- raw html: |
    ${ start_accordion("Legal Custody", showing=False) }
