    x.lives_in_missouri = True
  else:
    x.lives_in_missouri = False
---
generic object: ALIndividual
id: Residency info for user for any state
question: ${ "Your" if x.instanceName == "users[0]" else "Your spouse's" } residency in ${ state_name(x.address.state) }
fields:
  - How long ${ "have you" if x.instanceName == "users[0]" else "has your spouse" } lived in ${ state_name(x.address.state) }?: x.mo_length_of_residence_choice
    datatype: radio
