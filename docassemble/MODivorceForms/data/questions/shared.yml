  retirement_accounts.display_name = "Retirement accounts"
---
only sets: 
  - retirement_accounts[i].market_value
  - retirement_accounts[i].recommended_debt
id: describe retirement_accounts
reconsider: retirement_accounts[i].display_name
question: |
  Tell us about your ${ retirement_accounts[i].display_name }
subquestion: |

  Make your best guess for the market value.
  
  % if i > 1:
  You have already told us about your ${ comma_and_list(asset.display_name for asset in retirement_accounts.complete_elements()) }.
  % elif i > 0:
  You have already told us about your ${ comma_and_list(asset.display_name for asset in retirement_accounts.complete_elements()) }.
  % endif
fields:
  - Type of retirement account: retirement_accounts[i].source
    code: |
      retirement_accounts.ordered
  - Other (explain): retirement_accounts[i].source_other
    show if:
      variable: retirement_accounts[i].source
      is: other
  - Name of company: retirement_accounts[i].name
    required: False
  - Total present value: retirement_accounts[i].market_value
    maxlength: 76
    datatype: currency
  - Percentage vested: retirement_accounts[i].percent_vested
    maxlength: 76
    datatype: number
  - Is this marital or nonmarital property?: retirement_accounts[i].marital_property
    choices:
      - Marital
      - Nonmarital
      - Both
  - note: |
      ${ collapse_template(marital_property_template) }
  - Person holding the interest: retirement_accounts[i].has_possession
    choices:
      - ${ petitioner.name.full() }
      - ${ respondent.name.full() }
      - Other: other
  - Who should get this property?: retirement_accounts[i].recommended_award
    choices:
      - ${ petitioner.name.full() }
      - ${ respondent.name.full() }
      - Other: other
      - Split the award: split
  - "How much should ${ users[0].name.full() } get?": retirement_accounts[i].award_percentage_choice
    choices:
      - "50%": 50
      - "75%": 75
      - "25%": 25
      - Other: other
    show if:
      variable: retirement_accounts[i].recommended_award
      is: split
  - What percentage?: retirement_accounts[i].award_percentage_other
    datatype: number
    min: 0
    max: 100
    show if:
      variable: retirement_accounts[i].award_percentage_choice
      is: other
validation code: |
  if retirement_accounts[i].source != "other":
    retirement_accounts[i].display_name = retirement_accounts.terms_ordered.get(retirement_accounts[i].source, retirement_accounts[i].source)
  else:
    retirement_accounts[i].display_name = retirement_accounts[i].source_other
  if retirement_accounts[i].recommended_award == "split" and retirement_accounts[i].award_percentage_choice == "other" and users[0].name.full() == petitioner.name.full():
    retirement_accounts[i].award_percentage_petitioner = retirement_accounts[i].award_percentage_other/100
    retirement_accounts[i].award_percentage_respondent = 1- retirement_accounts[i].award_percentage_other/100
  elif retirement_accounts[i].recommended_award == "split" and users[0].name.full() == petitioner.name.full():
    retirement_accounts[i].award_percentage_petitioner = float(retirement_accounts[i].award_percentage_choice)/100
    retirement_accounts[i].award_percentage_respondent = 1- float(retirement_accounts[i].award_percentage_choice)/100
  elif retirement_accounts[i].recommended_award == "split" and retirement_accounts[i].award_percentage_choice == "other" and users[0].name.full() == respondent.name.full():
    retirement_accounts[i].award_percentage_respondent = retirement_accounts[i].award_percentage_other/100
    retirement_accounts[i].award_percentage_petitioner = 1- retirement_accounts[i].award_percentage_other/100
  elif retirement_accounts[i].recommended_award == "split" and users[0].name.full() == respondent.name.full():
    retirement_accounts[i].award_percentage_respondent = float(retirement_accounts[i].award_percentage_choice)/100
    retirement_accounts[i].award_percentage_petitioner = 1- float(retirement_accounts[i].award_percentage_choice)/100
  else:
    retirement_accounts[i].award_percentage_petitioner = None
    retirement_accounts[i].award_percentage_respondent = None
  retirement_accounts[i].ownership = retirement_accounts[i].has_possession
  retirement_accounts[i].is_amount_owed = None
