  elif other_assets[i].is_amount_owed and other_assets[i].recommended_debt == "split" and other_assets[i].user_percentage_choice == "other" and users[0].name.full() == respondent.name.full():
    other_assets[i].respondent_debt_percentage = other_assets[i].user_percentage_other/100
    other_assets[i].petitioner_debt_percentage = 1 - other_assets[i].user_percentage_other/100
  elif other_assets[i].is_amount_owed and other_assets[i].recommended_debt == "split" and users[0].name.full() == respondent.name.full():
    other_assets[i].respondent_debt_percentage = float(other_assets[i].user_percentage_choice)/100
    other_assets[i].petitioner_debt_percentage = 1 - float(other_assets[i].user_percentage_choice)/100
  else:
