    Do you have information about any other custody proceeding concerning any of the children pending in a court of this or any other state?: ${ word(yesno(other_custody_proceeding)) }

    Have you participated in other litigation concerning the custody of any of the children in this or any other state?: ${ word(yesno(other_litigation)) }

    Have any of the children been a victim of abuse or neglect?: ${ word(yesno(abuse_or_neglect)) }

