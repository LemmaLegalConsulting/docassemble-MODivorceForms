    datatype: object
    choices: people_choices
    disable others: True
  - code: |
      visitation_supervisor.name_fields()
---
id: follow up block for sole physical custody
if: physical_custody in ["petitioner","respondent"] and visitation
question: Reason for sole physical custody
subquestion: |
  Describe why
fields:
  - no label: physical_custody_sole_explanation
    datatype: area
