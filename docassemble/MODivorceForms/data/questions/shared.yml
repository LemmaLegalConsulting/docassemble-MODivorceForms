  if other_parties[0].previously_married and other_parties[0].last_marriage_end_date != "" and (as_datetime(other_parties[0].last_marriage_end_date) > today() or as_datetime(other_parties[0].last_marriage_end_date) < as_datetime(other_parties[0].birthdate)):
