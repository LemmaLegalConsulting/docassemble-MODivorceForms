id: one maintenance award question
question: Maintenance award
subquestion: |
  Maintenance is the financial support of either spouse during and following dissolution of marriage proceedings. This financial support considers ONLY the financial needs of the spouse, separate from child support - as the case may be.
  
fields:
  - Should the court award maintenance to ${ petitioner.name_full() } or ${ respondent.name_full() }?: relief['maintenance']
    datatype: yesnoradio
  - Who should be awarded maintenance?: maintenance_awarded_to
    js show if: |
      val("relief['maintenance']")
    choices:
      - ${ petitioner.name_full() } should be paid maintenance by ${ respondent.name_full() }: petitioner
      - ${ respondent.name_full() } should be paid maintenance by ${ petitioner.name_full() }: respondent
    datatype: radio
  - How much?: maintenance_amount
    datatype: currency
    js show if: |
      val("relief['maintenance']")
  - Should the maintenance be subject to modification?: maintenance_modifiable
    datatype: yesnoradio
    js show if: |
      val("relief['maintenance']")
---
id: maintenance currently paid question
question: Current maintenance award
subquestion: |
  ${ prog_disclose(maintenance_template) }
  
  If maintenance was awarded in a previous divorce, or earlier in the case, you can answer yes.  But in most cases there will not already be an award of maintenance.

fields:
  - Is any maintenance currently paid by ${ petitioner.name_full() } or ${ respondent.name_full() } to the other?: is_maintenance_currently_paid
    datatype: yesnoradio
    default: False
  - Who is currently paid maintenance?: maintenance_currently_paid_to
    js show if: |
      val("is_maintenance_currently_paid")
    choices:
      - ${ petitioner.name_full() } is paid maintenance by ${ respondent.name_full() }: petitioner
      - ${ respondent.name_full() } is paid maintenance by ${ petitioner.name_full() }: respondent
    datatype: radio
  - How much per month?: maintenance_currently_paid_amount
    datatype: currency
    js show if: |
      val('maintenance_currently_paid_to') === "petitioner" || val('maintenance_currently_paid_to') === "respondent"
validation code: |
  if is_maintenance_currently_paid:
    if maintenance_currently_paid_to == "petitioner":
      petitioner.maintenance_received = maintenance_currently_paid_amount
      petitioner.maintenance_paid = 0
      respondent.maintenance_received = 0
      respondent.maintenance_paid = maintenance_currently_paid_amount
    if maintenance_currently_paid_to == "respondent":
      petitioner.maintenance_received = 0
      petitioner.maintenance_paid = maintenance_currently_paid_amount
      respondent.maintenance_received = maintenance_currently_paid_amount
      respondent.maintenance_paid = 0
  else:
    petitioner.maintenance_received = 0
    petitioner.maintenance_paid = 0
    respondent.maintenance_received = 0
    respondent.maintenance_paid = 0
