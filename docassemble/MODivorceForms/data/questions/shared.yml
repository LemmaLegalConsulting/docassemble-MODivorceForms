---
id: parents of child
question: Parents of ${ children[i].name_full() }
subquestion: |
  If you or your spouse are not a parent of this child by sexual intercourse, adoption or artificial insemination, please name the other parent.
fields:
  - Who are the parents of this child?: children[i].parents
    datatype: checkboxes
    choices:
      - ${ users[0] }
      - ${ other_parties[0] }
      - Other
    none of the above: False
---
comment: |
  children[i].parents = dict()
  children[i].parents['Other'] = False
  if children[i].birth_certificate[users[0].name.full()] or children[i].adopted_by_user:
    children[i].parents[users[0].name.full()] = True
  else:
    children[i].parents[users[0].name.full()] = False
    children[i].parents['Other'] = True
  if children[i].birth_certificate[other_parties[0].name.full()] or children[i].adopted_by_other_party:
    children[i].parents[other_parties[0].name.full()] = True
  else:
    children[i].parents[other_parties[0].name.full()] = False
    children[i].parents['Other'] = True
    
---
id: tax dependenc of child
question: Tax dependency ${ children[i].name_full() }
subquestion: |
  The Form 14 calculation assumes that the parent receiving support will claim the children as dependents. If the parent paying support is entitled to claim one or more of the children, then the Form 14 guidelines are unjust and inappropriate  and the second box in Paragraph 15 should be checked.
fields:
  - Who should claim ${ children[i].name_full() } as a tax dependent in even years?: children[i].tax_dependency_even
    choices:
      - ${ users[0] }
      - ${ other_parties[0] }
    default: ${ support_recipient }
  - Who should claim ${ children[i].name_full() } as a tax dependent in odd years?: children[i].tax_dependency_odd
    choices:
      - ${ users[0] }
      - ${ other_parties[0] }
    default: ${ support_recipient }
