    Existing person: ${ showifdef('visitation_supervisor') }

    First: ${ showifdef('visitation_supervisor.name.first') }

    Middle: ${ showifdef('visitation_supervisor.name.middle') }

    Last: ${ showifdef('visitation_supervisor.name.last') }
- Edit: physical_custody_sole_explanation
  button: |
    **Reason for sole physical custody**

    ${ showifdef('physical_custody_sole_explanation') }
- Edit: physical_custody_other
  button: |
