## CHILDREN RELIEF AND SUPPORT
id: communications question
question: Communication between parents
subquestion: |
  How should the parents communicate about the children? Check each box that is appropriate.
fields:
  - Communication methods:  communications
    datatype: checkboxes
    choices:
      - In person: in_person
      - Home telephone: home_telephone
      - Work telephone: work_telephone
      - Mobile telephone: mobile_telephone
      - Letter via U.S. Postal Service: letter
      - E-mail: email
      - Using a third person: third_party
---
id: follow up question for communications through third party
if: communications["third_party"]
reconsider: people_choices
sets:
 - communications_other.name.first
question: Communication
subquestion: |
  Who should the parties communicate through?
fields:
  - Existing person: communications_other
    datatype: object
    choices: people_choices
    disable others: True
  - code: |
      communications_other.name_fields()
---
id: object for communications third party
objects: 
  - communications_other: ALIndividual
---
id: Child Support Award
reconsider: child_support_choices
question: |
  Child Support Award
fields:
  - Who are you asking the court to award child support to?: child_support
    datatype: radio
    code: |
      child_support_choices
validation code: |
  if child_support in ["petitioner", "none","third_party"]:
    support_recipient = petitioner
    support_payer = respondent
  elif child_support in ["respondent"]:
    support_recipient = respondent
    support_payer = petitioner  
  if showifdef('doc_list_selected["petition_attachment"]') or showifdef('doc_list_selected["answer_attachment"]'):
    if child_support == "none":
      relief['child_support'] = False
    else:
      relief['child_support'] = True
---
if: not minor_children
code: |
  relief['child_support'] = False
---
id: child support options
code: |
  temp_child_support_choices = list()
  temp_child_support_choices.append({"petitioner":petitioner.name_full()})  
  temp_child_support_choices.append({"respondent":respondent.name_full()})
  if defined('physical_custody') and physical_custody == "Third Party":
    temp_child_support_choices.append({"third_party":physical_custody_other.name_full()})
  temp_child_support_choices.append({"none":"No child support awarded"})
  child_support_choices = temp_child_support_choices
