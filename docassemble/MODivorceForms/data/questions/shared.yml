    datatype: currency
  - Monthly Payment: debts[i].monthly_payment
    datatype: currency
    required: False 
  - Marital or separate debt: debts[i].marital_property
    datatype: radio
    choices:
      - Marital
      - Nonmarital
      - Both
  - Who should pay this debt?: debts[i].recommended_debt
    choices:
      - ${ petitioner.name.full() }
      - ${ respondent.name.full() }
      - Split the debt: split
  - How much should ${ users[0].name.full() } pay?: debts[i].user_percentage_choice
    choices:
      - "50%": 50
      - "75%": 75
      - "25%": 25
      - Other: other
    show if:
      variable: debts[i].recommended_debt
      is: split
