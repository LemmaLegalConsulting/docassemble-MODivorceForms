question: Who have the children lived with in the past 5 years?
subquestion: |
  % if len(persons_lived_with.complete_elements()) > 0:
  You have already said that the children have lived with ${ comma_and_list(persons_lived_with.complete_elements()) }.
  % endif
  
fields:
  - Existing person: persons_lived_with[i]
    datatype: object
    choices: parent_and_people_choices
    disable others: True
    exclude:
     - persons_lived_with.complete_elements()
  - code: |
      persons_lived_with[i].name_fields()
  - code: |
      persons_lived_with[i].address.address_fields()
validation code: |
  validate_us_state(persons_lived_with[i].address)
---
id: persons lived with another
question: Did the children live with anybody else during the last five years?
subquestion: |
  You have already mentioned:
  % for person in persons_lived_with.complete_elements():

   - ${ person.name_full() }, ${ person.address.on_one_line() }
  % endfor
fields:
  - no label: persons_lived_with.there_is_another
    datatype: yesnoradio
---
id: legal custody of child
question: Legal custody of ${ children[i].name_full() }
fields:
  - Who should have legal custody of ${ children[i].name_full() }?: children[i].legal_custody
    datatype: radio
    choices:
      - ${ petitioner }: petitioner
      - ${ respondent }: respondent
      - Both spouses jointly: Joint
      - Third party: Third Party
    default: ${ legal_custody }
---
id: set legal custody for child if selected for all children
if: legal_custody_all_children
code: |
  children[i].legal_custody = legal_custody
---
id: don't ask legal_custody for adult children
if: not children[i].unemancipated
code: |
  children[i].legal_custody = None
---
id: other legal custody
reconsider:
  - people_choices
generic object: ALPeopleList

sets:
  - children[i].legal_custody_other.name.first
  - children[i].legal_custody_other.name.last
  - children[i].legal_custody_other.name.middle
  - children[i].legal_custody_other.name.suffix

question: |
  What other person should have legal custody of ${ children[i].name_full() }?

fields:
  - Existing person: children[i].legal_custody_other
    datatype: object
    choices: people_choices
    disable others: True
    exclude:
     - users[0]
     - other_parties[0]
  - code: |
      children[i].legal_custody_other.name_fields()
---
id: legal custody other object
objects: 
  - children[i].legal_custody_other: ALIndividual
---
id: follow up for third party legal custody
reconsider: people_choices
sets:
 - legal_custody_other.name.first
if: legal_custody == "Third Party"
question: Sole Legal Custody to Third Party
fields:
  - Existing person: legal_custody_other
    datatype: object
    choices: people_choices
    disable others: True
  - code: |
      legal_custody_other.name_fields()
---
id: legal custody third party object
objects: 
  - legal_custody_other: ALIndividual
---
id: legal_custody question
question: Legal Custody
subquestion: |
  Legal custody refers to decision-making authority related to health, education, and general welfare of the children.
fields:
 - What would you like to ask the court to give you in terms of legal custody?: legal_custody
   datatype: radio
   choices:
      - "Sole legal custody to ${ petitioner } (${ petitioner } makes all decisions for children)": petitioner
      - "Sole legal custody to ${ respondent } (${ respondent } makes all decisions for children)": respondent
      - "Both spouses jointly (decisions are made together)": Joint
      - "Third party (someone else with custody of the children makes decisions)": Third Party
 - note: |
    Asking the court to give custody of your children to someone else is a difficult decision to make, and cases like this can be complicated to handle on your own. It's important to know your rights as a parent. Consider reaching out to a Missouri licensed attorney for legal advice on how to proceed.
   show if:
     variable: legal_custody
     is: Third Party
 - Should this apply to all children involved in this case?: legal_custody_all_children
   datatype: yesnoradio
---
id: follow up reason for sole legal custody
if: legal_custody in ["petitioner", "respondent"]
question: Reason for sole custody
subquestion: |
  Missouri Law requires a statement of the reasons for a request for no shared decision-making. You must enter a reason on this line.
fields:
  - no label: legal_custody_sole_explanation
    datatype: area
---
id: physical_custody question
question: Physical Custody
subquestion: |
  Physical custody refers to the time spent with each parent.
fields:
 - What would you like to ask the court to give you in terms of physical custody?: physical_custody
   datatype: radio
   choices:
      - "Sole physical custody to ${ petitioner }: (${ petitioner } has the kids in their custody 100% of the time with possible supervised visitation to ${ respondent })": petitioner
      - "Sole physical custody to ${ respondent }: (${ respondent } has the kids in their custody 100% of the time with possible supervised visitation to ${ petitioner })": respondent
      - "Both spouses jointly (both parents have some time with the kids without supervision)": Joint
      - "Third party (someone else has custody of the kids)": Third Party
 - Should this apply to all children involved in this case?: physical_custody_all_children
   datatype: yesnoradio
 - Whose address should you use for mailing and educational purposes?: physical_custody_address
   datatype: radio
   choices:
    - ${ petitioner }: petitioner
    - ${ respondent }: (${ respondent }
   show if: 
     variable: physical_custody
     is: Joint
---
id: follow up visitation question for sole physical_custody
question: Visitation
fields:
  - Should visitation with ${ respondent if physical_custody == "petitioner" else petitioner } be supervised?: visitation
    datatype: yesnoradio
---
