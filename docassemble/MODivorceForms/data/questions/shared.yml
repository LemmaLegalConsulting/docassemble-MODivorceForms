id: children complete from petition
code: |
  children[i].name.first
  if showifdef('doc_list_selected["answer_attachment"]') or showifdef('doc_list_selected["petition_attachment"]') or showifdef('doc_list_selected["judgment_attachment"]') or showifdef('doc_list_selected["parenting_plan_attachment"]') or showifdef('doc_list_selected["confidential_information_sheet_attachment"]'):
    children[i].birthdate
  if 'petition_attachment' in doc_list_selected.true_values():
    if children[i].unemancipated:
      children[i].lived_with.name.first
    children[i].address.address
    if children[i].unemancipated:
      if children[i].legal_custody == "Third Party":
        children[i].legal_custody_other.name.first
      if children[i].physical_custody == "Third Party":
        children[i].physical_custody_other.name.first
    if showifdef('doc_list_selected["petition_attachment"]'):
      children[i].adopted
    if children[i].birth_certificate["Other"]:
      children[i].birth_certificate_other.name.first
    if children[i].parents["Other"]:
      children[i].other_parent.name.first
  if 'parenting_plan_attachment' in doc_list_selected.true_values() and legal_custody != "Third Party" and physical_custody != "Third Party":
    
    if children[i].unemancipated:
      children[i].tax_dependency_even
  if showifdef('doc_list_selected["certificate_of_dissolution_attachment"]'):
    children[i].under_18_in_household
  children[i].complete = True
