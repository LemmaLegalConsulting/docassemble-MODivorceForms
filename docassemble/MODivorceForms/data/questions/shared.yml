id: code to present relevant service options
code: |
  temp_service_type_choices = list()
  if users[0].name.full() == petitioner.name.full():
    temp_service_type_choices.append({'label': other_parties[0].name_full()  + " has signed a verified Respondent’s Answer to Petition for Dissolution of Marriage, which is being filed with the Petition for Dissolution of Marriage. Therefore, do not issue a summons.","value":"none"})
  if other_parties[0].address.state == "MO":
    temp_service_type_choices.append({'label': other_parties[0].name_full() + " should be served with a summons at their home.","value":"home"})
  if users[0].name.full() == petitioner.name.full() and (not defined('other_parties[0].jobs.there_are_any') or (len(other_parties[0].jobs) > 0 or other_parties[0].has_self_employment_income) and other_parties[0].employer.address.state == "MO"):
    temp_service_type_choices.append({'label': other_parties[0].name_full() + " should be served with a summons at their place of employment.","value":"work"})
  if users[0].name.full() == petitioner.name.full() and other_parties[0].address.state != "MO" and (not defined('other_parties[0].employer.address.address') or other_parties[0].employer.address.state != "MO"):
    temp_service_type_choices.append({'label': other_parties[0].name_full() + " cannot be served in Missouri. Therefore, service by registered mail is requested. A copy of the Affidavit for Service by Mail is attached to this form. See Missouri Supreme Court Rule 54.12(b).","value":"mail"})
  if not other_parties[0].address_known and not defined('other_parties[0].employer.address.address'):
    temp_service_type_choices.append({'label': "The address of " + other_parties[0].name_full() + " is unknown and cannot be found. Therefore, service by publication is requested. A copy of the Request for Service by Publication is attached to this form.", "value": "publication"})
  service_type_choices = temp_service_type_choices
