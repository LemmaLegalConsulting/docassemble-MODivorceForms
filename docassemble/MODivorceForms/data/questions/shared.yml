- Edit: other_parties[0].self_supporting
  button: |
    Is ${ other_parties[0].name_full() } able to support themselves on their monthly income?: **${ "Unknown" if other_parties[0].self_supporting == None else word(yesno(other_parties[0].self_supporting))}**
- Edit: other_parties[0].employer.name.text
  button: |
    % if other_parties[0].jobs.there_are_any:
    Tell us about ${ other_parties[0].pronoun_possessive("main employer") }.
    % elif other_parties[0].has_self_employment_income:
    Describe ${ other_parties[0].pronoun_possessive("self employment") }and provide the address.
    % endif
  
    Name: ${ other_parties[0].employer.name.text }
    
    Address: ${ other_parties[0].employer.address.on_one_line() }
    
    Phone: ${ showifdef('other_parties[0].employer.phone_number') }
