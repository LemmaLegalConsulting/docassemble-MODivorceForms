  secured_debts.clear()
  for debt_list in [showifdef('real_estate'), showifdef('vehicles'), showifdef('securities'), showifdef('personal_goods'), showifdef('farm'), showifdef('businesses'), showifdef('other_assets')]:
    for item in debt_list:
      if item.is_amount_owed and not item in secured_debts.complete_elements():
        secured_debts.append(item)
        item.already_included = True
        if not defined('secured_debts[-1].source'):
          secured_debts[-1].source = debt_list.instanceName
