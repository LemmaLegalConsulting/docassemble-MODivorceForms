---
comment: |
  Assets are gathered jointly for the user and the spouse.  The information question about the asset asks who the asset should be awarded to.  After all the different assets are gathered, a code block based on the recommended award assigns it to a single ALAssetList attribute called .assets.  This means that different asset lists can have their own attributes in the information question, but must all share the same attributes as .assets. 
  
  Some of the assets can also have an attached loan, and the information question allows you to assign that loan (including splitting it).  This will create a secured_debts ALAssetList, where each debt is a soft copy of the asset it is attached to.  After collecting joint debts (which can also be assigned and split), a code block will create a ALAssetList attribute .debts for both user and spouse. If the debts are not split, then these debts will also be soft copys, but if they are split, then they are new objects for the .debts attribute (and one will be created for each party).
  
