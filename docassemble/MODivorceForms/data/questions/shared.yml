question: Other minor children for ${ x.name_full() }
fields:
  - "How many minor children does ${ x.name_full() } have with someone other than ${ x.spouse.name.full() }?": x.other_children
    datatype: integer
    min: 0    
---
if: not minor_children_before_marriage
generic object: ALIndividual
code: |
  x.other_children = 0
---
id: Additional information about children
question: Additional information about children
continue button field: additional_children_information
fields:
  - Do you know of anyone other than you or your spouse who has physical custody of any of the children or claims to have custody or visitation rights with respect to any of the children?: others_with_physical_custody
    datatype: yesnoradio
  - Do you have information about any other custody proceeding concerning any of the children pending in a court of this or any other state?: other_custody_proceeding
    datatype: yesnoradio
    js show if:   |
      val("others_with_physical_custody") === true || val("others_with_physical_custody") === false
  - Have you participated in other litigation concerning the custody of any of the children in this or any other state?: other_litigation
    datatype: yesnoradio
    js show if:   |
      val("other_custody_proceeding") === true || val("other_custody_proceeding") === false
  - Have any of the children been a victim of abuse or neglect?: abuse_or_neglect
    datatype: yesnoradio
    js show if:   |
      val("other_litigation") === true || val("other_litigation") === false
  - Have any orders pertaining to any of the children been entered by the Family Support Division?: family_support_order
    datatype: yesnoradio
    js show if:   |
      val("abuse_or_neglect") === true || val("abuse_or_neglect") === false
---
id: single children explanation question
question: Further information
subquestion: |
  You need to explain some of your answers in the petition:
  
  % if others_with_physical_custody:
  You said than is someone other than you or your spouse who has physical custody of any of the children or claims to have custody or visitation rights with respect to any of the children.
  % endif  
  
  % if other_custody_proceeding:
  You said you have information about another custody proceeding concerning the children pending in a court of this or another state.
  % endif
  
  % if other_litigation:
  You said that there is other litigation concerning the custody of any of the children.
  % endif
  
  % if abuse_or_neglect:
  You said that at least one of the children has been a victim of abuse or neglect.
  % endif
fields:
  - no label: children_explanation
    datatype: area
