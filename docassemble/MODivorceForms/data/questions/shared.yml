id: attorney_casenet_template
template: attorney_casenet_template
subject: |
  How do I find information about the attorney on Case.net?
content: | 
  With your case open on [Case.net](https://www.courts.mo.gov/cnet), click the tab labeled "Parties & Attorneys". The date the case is labed Date Filed, under "Judge/Commissioner Assigned".
  
  In some cases, information about the attorney may be underneath the parties. 

  [FILE pa_attorney.png, 100%]
---
id: party type code
code: |
  if case.filed in ["user0_filed", "not_filed"]:
    if users[0].attorney_involved:
      users[0].party_type_code = "PET"
      users[0].party_type_description = "Petitioner (with attorney)"
    else:
      users[0].party_type_code = "PETP"
      users[0].party_type_description = "Petitioner Acting Pro Se (with no attorney)"
  else:
    if users[0].attorney_involved:
      users[0].party_type_code = "RES"
      users[0].party_type_description = "Respondent (with attorney)"
    else:
      users[0].party_type_code = "RESP"
      users[0].party_type_description = "Respondent Acting Pro Se (with no attorney)"
---
id: other party type code
code: |
  if case.filed in ["other_parties0_filed"]:
    if other_parties[0].attorney_involved:
      other_parties[0].party_type_code = "PET"
      other_parties[0].party_type_description = "Petitioner (with attorney)"
    else:
      other_parties[0].party_type_code = "PETP"
      other_parties[0].party_type_description = "Petitioner Acting Pro Se (with no attorney)"
  else:
    if other_parties[0].attorney_involved:
      other_parties[0].party_type_code = "RES"
      other_parties[0].party_type_description = "Respondent (with attorney)"
    else:
      other_parties[0].party_type_code = "RESP"
      other_parties[0].party_type_description = "Respondent Acting Pro Se (with no attorney)"
---
code: |
  if case.filed in ["user0_filed", "not_filed"]:
    users[0].attorney.party_type_code = "APET"
    users[0].attorney.party_type_description = "Attorney for Petitioner"
  else:
    users[0].attorney.party_type_code = "ARES"
    users[0].attorney.party_type_description = "Attorney for Respondent"
---
code: |
  if case.filed in ["other_parties0_filed"]:
    other_parties[0].attorney.party_type_code = "APET"
    other_parties[0].attorney.party_type_description = "Attorney for Petitioner"
  else:
    other_parties[0].attorney.party_type_code = "ARES"
    other_parties[0].attorney.party_type_description = "Attorney for Respondent"
