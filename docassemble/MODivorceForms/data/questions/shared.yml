  ${ support_payer.name_full() } shall reimburse ${ support_recipient.name_full() } for ${ thousands(pay_work_childcare_expenses_percentage) }% of all reasonable work-related child care expenses.
  % else:
  ${ pay_work_childcare_expenses_dictionary[pay_work_childcare_expenses] }
  % endif
  % endif
fields:
