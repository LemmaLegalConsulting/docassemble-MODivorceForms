id: maintenance_review_template
template: maintenance_review_template
subject: |
  Part Two - Maintenance and Other Provisions
content: |
  Maintenance to Petitioner - 
  % if relief['maintenance'] and maintenance_awarded_to in ["petitioner"]:
  Respondent shall pay to Petitioner the sum of ${ maintenance_amount } per month as and for maintenance.  Said maintenance is is not subject to modification. Said maintenance shall terminate upon the death of either party, the remarriage of Petitioner, or at such earlier time as set forth herein.
  % else:
  No maintenance is to be paid to Petitioner by Respondent. This agreement is not subject to modification.
  % endif
  
  Maintenance to Respondent - 
  % if relief['maintenance'] and maintenance_awarded_to in ["respondent"]:
  Petitioner shall pay to Respondent the sum of ${ maintenance_amount } per month as and for maintenance.  Said maintenance is is not subject to modification. Said maintenance shall terminate upon the death of either party, the remarriage of Respondent, or at such earlier time as set forth herein.
  % elif not respondent.lives_in_missouri and not marriage.live_together_in_mo:
  The court lacks jurisdiction to enter any orders with respect to maintenance of Respondent.
  % else:
  No maintenance is to be paid to Petitioner by Respondent. This agreement is not subject to modification.
  % endif

  % if relief['maintenance'] and maintenance_awarded_to in ["petitioner","respondent"] and maintenance_income_withholding:
  Income withholding shall be prepared by the person receiving maintenance and issued by the circuit clerk upon the effective date of this order.
  % elif relief['maintenance'] and maintenance_awarded_to in ["petitioner","respondent"] and not maintenance_income_withholding:
  Income withholding shall not issue for the following reason(s):
  ${ maintenance_income_withholding_reason }
  % else:
  Income Withholding left blank because maintenance will not be paid by either party
  % endif
