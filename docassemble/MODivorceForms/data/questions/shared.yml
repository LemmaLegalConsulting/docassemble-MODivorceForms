## RELIEF ##
id: relief object
objects:
  - relief: DADict
---
id: set relief ['divide_property']
code: |
  relief['divide_property'] = True
---
id: Relief Requested
question: What do you want the court to do?
subquestion: |
  Part of ${ "an Answer" if case.filed == "other_parties0_filed" else "a Petition" } is saying what you want the court to do.  This is called the Relief that you request.

  The ${ "Answer" if case.filed == "other_parties0_filed" else "Petition" } will ask for the standard request in a divorce, which includes

   - Dissolving the marriage
   - Dividing marital property and debt
  % if minor_children:
   - Granting custody
   - Granting child support
  % endif

    You can also ask for the court to award Maintenance.  Maintenance is the financial support of either spouse during and following dissolution of marriage proceedings. This financial support considers ONLY the financial needs of the spouse, separate from child support - as the case may be.

  We will ask about maintenance later.
  
fields:
  - Do you want to change your name to your prior name?: relief['change_name']
    datatype: yesnoradio
    show if:
      code: |
        users[0].has_prior_name
  - Is there any other relief you want to request from the court?: relief['other']
    datatype: yesnoradio
  - Explain: relief_other
    show if: relief['other']
---  
if: not users[0].has_prior_name
code: |
  relief['change_name'] = False
---
code: |
  if minor_children:
    relief['custody'] = True
  else:
    relief['custody'] = False
---
code: |
  temp_relief_options = list()
  if minor_children:
    temp_relief_options.append({"custody":"Grant custody of the children"})
    if case.filed == "other_parties0_filed" or other_parties[0].lives_in_missouri or marriage.live_together_in_mo:
      temp_relief_options.append({"child_support":"Enter appropriate orders whith respect to the support of the children"})
  temp_relief_options.append({"divide_property":"Divide the marital property and debts"})
  if case.filed == "other_parties0_filed" or other_parties[0].lives_in_missouri or marriage.live_together_in_mo:
    temp_relief_options.append({"maintenance":"Award maintenance"})
  if users[0].has_prior_name:
    temp_relief_options.append({"change_name":"Change my name to my former name"})
  temp_relief_options.append({"other":"Other"})
  relief_options = temp_relief_options
