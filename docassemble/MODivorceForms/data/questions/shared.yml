---
id: are there any extraordinary medical costs
generic object: ALIndividual
question: Extraordinary Medical Costs to be paid by ${ x.name_full() }
subquestion: |
  Extraordinary medical costs are predictable and recurring expenses for things like: ongoing dental treatment, orthodontic treatment, asthma treatment, and physical therapy.

  % if x.spouse.extraordinary_medical_costs.has_been_gathered() and len(x.spouse.extraordinary_medical_costs) > 0:
  You have already told us about ${ x.spouse } paying the following extraordinary medical costs: ${ comma_and_list([cost.description for cost in x.spouse.extraordinary_medical_costs.complete_elements()]) }
  % endif
fields:
  - Are there any extraordinary medical costs to be paid by ${ x.name_full() }?: x.extraordinary_medical_costs.there_are_any
    datatype: yesnoradio
---
if: not minor_children
generic object: ALIndividual
code: |
  x.extraordinary_medical_costs.there_are_any = False
---
id: extraordinary medical cost information
generic object: ALIndividual
question: |
  What is the ${ ordinal(i) } extraordinary medical cost to be paid by ${ x.name_full() }?
subquestion: |
  Extraordinary medical costs are predictable and recurring expenses for things like: ongoing dental treatment, orthodontic treatment, asthma treatment, and physical therapy.
  
  % if x.spouse.extraordinary_medical_costs.has_been_gathered() and len(x.spouse.extraordinary_medical_costs) > 0:
  You have already told us about ${ x.spouse } paying the following extraordinary medical costs: ${ comma_and_list([cost.description for cost in x.spouse.extraordinary_medical_costs.complete_elements()]) }
  % endif
  
  % if len(x.extraordinary_medical_costs.complete_elements()) > 0:
  You have told us that you are paying the following extraordinary medical costs: ${ comma_and_list([cost.description for cost in x.extraordinary_medical_costs.complete_elements()]) }
  % endif
fields:
  - Description: x.extraordinary_medical_costs[i].description
  - Amount of extraordinary medical cost: x.extraordinary_medical_costs[i].value
    datatype: currency
  - Times per year pays this cost: x.extraordinary_medical_costs[i].times_per_year
    input type: radio
    default: 12
    code: |
      times_per_year_list
---
id: extraordinary medical costs
generic object: ALIndividual
question: Extraordinary Medical Costs to be paid by ${ x.name_full() }
subquestion: |
  % if x.spouse.extraordinary_medical_costs.has_been_gathered() and len(x.spouse.extraordinary_medical_costs) > 0:
  You have already told us about ${ x.spouse } paying the following extraordinary medical costs: ${ comma_and_list([cost.description for cost in x.spouse.extraordinary_medical_costs.complete_elements()]) }
  % endif
  
