---
code: |
  if users[0].race in ["American Indian or Alaska Native", "Asian", "Black or African American", "Native Hawaiian or other Pacific Islander", "White", "Hispanic or Latino", "Middle Eastern or North African (MENA)", "Other"]:
    race_self_identified = True
    if case.filed in ["user0_filed", "not_filed"]:
      petitioner_race_identified = True
      respondent_race_identified = False
    else:
      petitioner_race_identified = False
      respondent_race_identified = True
  else:
    race_self_identified = False
    petitioner_race_identified = False
    respondent_race_identified = False
  
---
id: Previous marriages info for self
question: Previous marriages for ${ users[0].name_full() }
fields:  
  - Previously married?: users[0].previously_married
    datatype: yesnoradio
  - Number of previous marriages: users[0].number_of_marriages
    datatype: number
    show if: users[0].previously_married
    required: False
  - Date Last Marriage Ended: users[0].last_marriage_end_date
    datatype: date
    required: False
