---
id: Court Appearance
question: Court Appearance
generic object: ALIndividual
fields:
  - ${ x } will make an appearance: x.appears
    datatype: yesnoradio
  - Will ${ x } appear with an attorney?: x.appears_with_attorney
    datatype: yesnoradio
    show if: x.appears
  - ${ x } submits an affidavit: x.submitted_cause
    datatype: yesnoradio
---
id: guardian ad litem court appearance
question: Guardian ad litem
fields:
  - ${ guardian_ad_litem }, Guardian ad Litem, appears in person: guardian_ad_litem.appears
    datatype: yesnoradio
---
id: third party object
objects:
  - third_party: ALIndividual
---
id: third party court appearance
question: Third Party
fields:
  - Another person will make an appearance: third_party_appears
    datatype: yesnoradio
  - Third party first name: third_party.name.first
    show if: third_party_appears
  - Third party middle name: third_party.name.middle
    show if: third_party_appears
    required: False
  - Third party last name: third_party.name.last
    show if: third_party_appears
  - Third party suffix: third_party.name.suffix
    show if: third_party_appears
    required: False
  - Will this person appear with an attorney?: third_party_appears_with_attorney
    datatype: yesnoradio
    show if: third_party_appears
---
id: personal_jurisdiction
question: Personal Juridisdiction
subquestion: |
  % if personal_jurisdiction_over_respondent_default:
  It appears that there is personal jurisdiction over ${ respondent } because ${ respondent } has been a resident of Missouri for at least 90 days.
  % else:
  It appears that there is not personal jurisdiction over ${ respondent } because ${ respondent } has not been a resident of Missouri for at least 90 days.
  % endif
fields:
  - Does the court have personal jurisdiction over ${ respondent }?: personal_jurisdiction_over_respondent
    datatype: yesnoradio
    default: ${ personal_jurisdiction_over_respondent_default }
---
depends on: 
  - respondent.resident_for_90_days
code: |
  if respondent.resident_for_90_days:
    personal_jurisdiction_over_respondent_default = True
  else:
    personal_jurisdiction_over_respondent_default = False
  
---
id: child custody jurisdiction
question: Jurisdiction over child custody
fields: 
  - Does the court have jurisdiction over the custody arrangements?: child_custody_jurisdiction
    datatype: yesnoradio
  - Additional information about child custody jurisdiction: legal_custody_jurisdiction_additional_info
    datatype: area
    show if: child_custody_jurisdiction
---
id: child support jurisdiction
question: Jurisdiction over child support
fields:
  - Does the court have jurisdiction over child support?: child_support_jurisdiction
    datatype: yesnoradio
  - Additional information about child support jurisdiction: child_support_additional_info
    datatype: area
    show if: child_support_jurisdiction
---
id: attorney fees
question: Attorney's Fees
fields:
  - Who should be awarded attorney's fees from the other party?: attorney_fees
    datatype: radio
    choices:
      - Neither party: neither
      - ${ petitioner }: petitioner
      - ${ respondent }: respondent
  - How much should ${ petitioner } pay ${ respondent.attorney if respondent.attorney_involved else respondent }?: attorney_fees_respondent
    datatype: currency
    show if:
      variable: attorney_fees
      is: respondent
  - How much should ${ respondent } pay ${ petitioner.attorney if petitioner.attorney_involved else petitioner }?: attorney_fees_petitioner
    datatype: currency
    show if:
      variable: attorney_fees
      is: petitioner
---
id: court costs
question: Court Costs
fields:
  - Should court costs be waived?: court_costs
    datatype: yesnoradio
---
comment: |
  parenting_plan_A.exhibit_number
  parenting_plan_B.exhibit_number


---
id: name change
generic object: ALIndividual
question: Does ${ x } want to restore their former name?
fields:
  - no label: x.name_change
    datatype: yesnoradio
---
id: former name
generic object: ALIndividual
question: What is ${ possessify(x,'former name') }?
fields:
  - code: |
      x.prior_name.name_fields()
---
id: guardian ad litem object
objects:
  - guardian_ad_litem: ALIndividual
---
id: additional information about the guardian ad litem
question: Additional information about the Guardian ad Litem
fields:
  - note: |
      guardian_ad_litem.address_fields()
  - Phone: guardian_ad_litem.phone
    datatype: phone
    required: False
---
id: is there a guardian_ad_litem?
question: Is there a Guardian ad Litem?
fields:
  - no label: guardian_ad_litem.exists
    datatype: yesnoradio
---
id: separation_agreement
question: Separation Agreement
fields:
  - Have the parties entered into a separation agreement for marital and non-marital property and debt: separation_agreement
    datatype: yesnoradio
---
id: other orders property object
objects:
  - other_orders_property: Thing
---
id: Other orders concerning property and debt
question: Other orders concerning property and debt
fields:
  - Do other orders exist?: other_orders_property.exists
    datatype: yesnoradio
  - Which party should be ordered to pay the other party?: other_orders_property.paying_party
    show if:
      variable: other_orders_property.exists
      is: True
    choices:
      - ${ users[0].name.full() }
      - ${ other_parties[0].name.full() }
  - Amount: other_orders_property.amount
    datatype: currency
    show if:
      variable: other_orders_property.exists
      is: True
  - Reason: other_orders_property.reason
    show if:
      variable: other_orders_property.exists
      is: True
validation code: |
  if other_orders_property.paying_party == users[0].name.full():
    other_orders_property.receiving_party = other_parties[0].name.full()
  else:
    other_orders_property.receiving_party = users[0].name.full()
---
id: other orders object
objects:
  - other_orders: Thing
---
id: Other orders
question: Other orders
fields:
  - Do other orders exist?: other_orders.exists
    datatype: yesnoradio
---
id: Judgment and Decree of Dissolution of Marriage object
objects:
  - judgment_attachment: DADict.using(object_type=ALDocument.using(has_addendum=True, default_overflow_message=AL_DEFAULT_OVERFLOW_MESSAGE), auto_gather=False, gathered=True)
---
id: judgment per-key document settings
code: |
  judgment_attachment[i].title = "Judgment and Decree of Dissolution of Marriage"
  judgment_attachment[i].filename = "judgment" if i == "redacted" else "judgment_unredacted"
---
id: judgment overflow fields
code: |
  judgment_attachment[i].overflow_fields["children_of_marriage"].overflow_trigger = 6
  judgment_attachment[i].overflow_fields["children_of_marriage"].label = "Additional Minor Children"
  judgment_attachment[i].overflow_fields.gathered = True
---
attachment:
  variable name: judgment_attachment[i].addendum
  docx template file: judgment_attachment_addendum.docx
  redact: i == "redacted"
---
id: Judgment and Decree of Dissolution of Marriage attachment
attachment:
  name: Judgment and Decree of Dissolution of Marriage ${ "Redacted" if i == "redacted" else "Unredacted" }
  filename: judgment${ "" if i == "redacted" else "_unredacted" }
  variable name: judgment_attachment[i][j]
  skip undefined: True
  redact: i == "redacted"
  pdf template file: judgment.pdf
  editable: False
  fields:
      - "case_county": ${ case.county } 
      - "petitioner_name_first": ${ petitioner.name.first } 
      - "petitioner_name_middle": ${ petitioner.name.middle } 
      - "petitioner_name_last": ${ petitioner.name.last } 
      - "petitioner_name_suffix": ${ petitioner.name.suffix } 
      - "respondent_name_first": ${ respondent.name.first } 
      - "respondent_name_middle": ${ respondent.name.middle } 
      - "respondent_name_last": ${ respondent.name.last } 
      - "respondent_name_suffix": ${ respondent.name.suffix } 
      - "petitioner_ssn": ${ redact(petitioner.ssn) } 
      - "respondent_ssn": ${ redact(respondent.ssn) } 
      - "respondent_active_duty": ${ not respondent.active_duty }
      - "respondent_active_duty2": ${ respondent.active_duty }
      - "case_personal_jurisdiction_over_respondent": ${ (respondent.lives_in_missouri and respondent.resident_for_90_days) or marriage.live_together_in_mo } 
      - "case_personal_jurisdiction_over_respondent_no": ${ not ((respondent.lives_in_missouri and respondent.resident_for_90_days) or marriage.live_together_in_mo) } 
      - "petitioner_resident_for_90 days": ${ petitioner.resident_for_90_days } 
      - "respondent_resident_for_90 days": ${ respondent.resident_for_90_days } 
      - "marriage_date": ${ format_date(marriage.recorded_date, format='MM/dd/yyyy') } 
      - "marriage_address_county": ${ nice_county_name(marriage.address) } 
      - "marriage_address_state": ${ state_name(marriage.address.state) } 
      - "marriage_date_last_resided": ${ format_date(marriage.separation_date, format='MM/dd/yyyy') } 
      - "petitioner_pregnant": ${ True } 
      - "respondent_pregnant": ${ True } 
      - "children": ${ number_of_children == 0 } 
      - "children4": ${ number_of_children > 0 } 
      - "children5": ${ number_of_children if number_of_children > 0 else "" } 
      - "children0_name_first": |
          % if len(children_of_marriage_minor) > 0:
          ${ redact(children_of_marriage_minor[0].name.first) }
          % endif
      - "children0_name_suffix": |
          % if len(children_of_marriage_minor) > 0:
          ${ redact(children_of_marriage_minor[0].name.suffix) }
          % endif
      - "children0_age": |
          % if len(children_of_marriage_minor) > 0:
          % if date_difference(starting=children_of_marriage_minor[0].birthdate,ending=today()).years > 1:
          ${ "{:.0f}".format(date_difference(starting=children_of_marriage_minor[0].birthdate,ending=today()).years) }
          % else:
          ${ date_difference(starting=children_of_marriage_minor[0].birthdate, ending=today()).describe(specificity='month', nice=False) }
