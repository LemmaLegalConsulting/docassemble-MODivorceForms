---
id: Statement of Income and Expenses object
objects:
  - income_statement_attachment: ALDocument.using(title="Statement of Income and Expenses", filename="income_statement", has_addendum=False, )
---
id: Statement of Income and Expenses attachment
attachment:
  name: Statement of Income and Expenses
  filename: income_statement
  variable name: income_statement_attachment[i]
  skip undefined: True
  pdf template file: income_statement.pdf
  editable: False
  fields:
      - "countyList": ${ case.county } 
      - "case_number": ${ case.docket_number }
      - "petitionersSuffixJrSrIII": ${ petitioner.name.suffix } 
      - "petitionersFirstName": ${ petitioner.name.first } 
      - "petitionersMiddleName": ${ petitioner.name.middle } 
      - "petitionersLastName": ${ petitioner.name.last } 
      - "respondentsFirstName": ${ respondent.name.first } 
      - "respondentsMiddleName": ${ respondent.name.middle } 
      - "respondentsLastName": ${ respondent.name.last } 
      - "respondentsSuffixJrSrIII": ${ respondent.name.suffix } 
      - "ie1p": ${ "Unknown" if petitioner.jobs.there_are_any == None else "$" + thousands(petitioner.jobs.total(times_per_year = 12), show_decimals=True) } 
      - "ie1r": ${ "Unknown" if respondent.jobs.there_are_any == None else "$" + thousands(respondent.jobs.total(times_per_year = 12), show_decimals=True) } 
      - "ie2p": ${ "Unknown" if petitioner.has_self_employment_income == None else "$" + thousands(petitioner.self_employment_income, show_decimals=True) } 
      - "ie2r": ${ "Unknown" if respondent.has_self_employment_income == None else "$" + thousands(respondent.self_employment_income, show_decimals=True) } 
      - "ie3r": ${ "Unknown" if respondent.other_incomes.there_are_any == None else "$" + thousands(respondent.other_incomes.total(source=['social security'], times_per_year=12), show_decimals=True) } 
      - "ie3p": ${ "Unknown" if petitioner.other_incomes.there_are_any == None else "$" + thousands(petitioner.other_incomes.total(source=['social security'], times_per_year=12), show_decimals=True) } 
      - "ie4p": ${ "Unknown" if petitioner.other_incomes.there_are_any == None else "$" + thousands(petitioner.other_incomes.total(source=['retirement'], times_per_year=12), show_decimals=True) } 
      - "ie4r": ${ "Unknown" if respondent.other_incomes.there_are_any == None else "$" + thousands(respondent.other_incomes.total(source=['retirement'], times_per_year=12), show_decimals=True) } 
      - "ie5p": ${ "Unknown" if petitioner.other_incomes.there_are_any == None else "$" + thousands(petitioner.other_incomes.total(source=['pension'], times_per_year=12), show_decimals=True) } 
      - "ie5r": ${ "Unknown" if respondent.other_incomes.there_are_any == None else "$" + thousands(respondent.other_incomes.total(source=['pension'], times_per_year=12), show_decimals=True) } 
      - "ie6p": ${ "Unknown" if petitioner.other_incomes.there_are_any == None else "$" + thousands(petitioner.other_incomes.total(source=['interest'], times_per_year=12), show_decimals=True) } 
      - "ie6r": ${ "Unknown" if respondent.other_incomes.there_are_any == None else "$" + thousands(respondent.other_incomes.total(source=['interest'], times_per_year=12), show_decimals=True) } 
      - "ie7p": ${ "Unknown" if petitioner.other_incomes.there_are_any == None else "$" + thousands(petitioner.other_incomes.total(source=['trust'], times_per_year=12), show_decimals=True) } 
      - "ie7r": ${ "Unknown" if respondent.other_incomes.there_are_any == None else "$" + thousands(respondent.other_incomes.total(source=['trust'], times_per_year=12), show_decimals=True) } 
      - "ie8p": ${ "$" + thousands(petitioner.other_incomes.total(source=['dividends'], times_per_year=12), show_decimals=True) } 
      - "ie8r": ${ "Unknown" if respondent.other_incomes.there_are_any == None else "$" + thousands(respondent.other_incomes.total(source=['dividends'], times_per_year=12), show_decimals=True) } 
      - "ie9p": ${ "Unknown" if petitioner.other_incomes.there_are_any == None else "$" + thousands(petitioner.other_incomes.total(source=['unemployment income'], times_per_year=12), show_decimals=True) } 
      - "ie9r": ${ "Unknown" if respondent.other_incomes.there_are_any == None else "$" + thousands(respondent.other_incomes.total(source=['unemployment income'], times_per_year=12), show_decimals=True) } 
      - "ie10r": ${ "Unknown" if respondent.other_incomes.there_are_any == None else "$" + thousands(respondent.other_incomes.total(source=['severance'], times_per_year=12), show_decimals=True) } 
      - "ie10p": ${ "Unknown" if petitioner.other_incomes.there_are_any == None else "$" + thousands(petitioner.other_incomes.total(source=['severance'], times_per_year=12), show_decimals=True) } 
      - "ie11p": ${ "Unknown" if petitioner.other_incomes.there_are_any == None else "$" + thousands(petitioner.other_incomes.total(source=['worker comp'], times_per_year=12), show_decimals=True) } 
      - "ie11r": ${ "Unknown" if respondent.other_incomes.there_are_any == None else "$" + thousands(respondent.other_incomes.total(source=['worker comp'], times_per_year=12), show_decimals=True) } 
      - "ie12p": ${ "Unknown" if petitioner.other_incomes.there_are_any == None else "$" + thousands(petitioner.other_incomes.total(source=['disability_insurance'], times_per_year=12), show_decimals=True) } 
      - "ie12r": ${ "Unknown" if respondent.other_incomes.there_are_any == None else "$" + thousands(respondent.other_incomes.total(source=['disability_insurance'], times_per_year=12), show_decimals=True) } 
      - "ie13r": ${ "Unknown" if respondent.other_incomes.there_are_any == None else "$" + thousands(respondent.other_incomes.total(source=['veteran'], times_per_year=12), show_decimals=True) } 
      - "ie13p": ${ "Unknown" if petitioner.other_incomes.there_are_any == None else "$" + thousands(petitioner.other_incomes.total(source=['veteran'], times_per_year=12), show_decimals=True) } 
      - "ie14p": ${ "Unknown" if petitioner.other_incomes.there_are_any == None else "$" + thousands(petitioner.other_incomes.total(source=['military'], times_per_year=12), show_decimals=True) } 
      - "ie14r": ${ "Unknown" if respondent.other_incomes.there_are_any == None else "$" + thousands(respondent.other_incomes.total(source=['military'], times_per_year=12), show_decimals=True) } 
      - "line1p": ${  "$" + thousands(float(petitioner.jobs.total(times_per_year=12)) + petitioner.self_employment_income + float(petitioner.other_incomes.total(times_per_year = 12)), show_decimals=True) } 
      - "line1r": ${  "$" + thousands(float(respondent.jobs.total(times_per_year=12)) + respondent.self_employment_income + float(respondent.other_incomes.total(times_per_year = 12)), show_decimals=True) } 
      - "ie16p": ${ "Unknown" if petitioner.benefits.there_are_any == None else "$" + thousands(petitioner.benefits.total(source=['ssi'], times_per_year=12), show_decimals=True) } 
      - "ie16r": ${ "Unknown" if respondent.benefits.there_are_any == None else "$" + thousands(respondent.benefits.total(source=['ssi'], times_per_year=12), show_decimals=True) } 
      - "ie17p": ${ "Unknown" if petitioner.benefits.there_are_any == None else "$" + thousands(petitioner.benefits.total(source=['tanf'], times_per_year=12), show_decimals=True) } 
      - "ie17r": ${ "Unknown" if respondent.benefits.there_are_any == None else "$" + thousands(respondent.benefits.total(source=['tanf'], times_per_year=12), show_decimals=True) } 
      - "ie18p": ${ "Unknown" if petitioner.benefits.there_are_any == None else "$" + thousands(petitioner.benefits.total(source=['medicaid'], times_per_year=12), show_decimals=True) } 
      - "ie18r": ${ "Unknown" if respondent.benefits.there_are_any == None else "$" + thousands(respondent.benefits.total(source=['medicaid'], times_per_year=12), show_decimals=True) } 
      - "ie19p": ${ "Unknown" if petitioner.benefits.there_are_any == None else "$" + thousands(petitioner.benefits.total(source=['food_stamps'], times_per_year=12), show_decimals=True) } 
      - "ie19r": ${ "Unknown" if respondent.benefits.there_are_any == None else "$" + thousands(respondent.benefits.total(source=['food_stamps'], times_per_year=12), show_decimals=True) } 
      - "line2c1p": ${ petitioner.other_children } 
      - "line2c1r": ${ respondent.other_children } 
      - "line2c3p": ${ "$" + thousands(petitioner.other_child_support_received, show_decimals=True) } 
      - "line2c3r": ${ "$" + thousands(respondent.other_child_support_received, show_decimals=True) } 
      - "maintenanceP1": ${ "$" + thousands(petitioner.maintenance_received, show_decimals=True) } 
      - "maintenanceR1": ${ "$" + thousands(respondent.maintenance_received, show_decimals=True) } 
      - "maintenanceOtherP": ${ "$" + thousands(petitioner.maintenance_other_received, show_decimals=True) } 
      - "maintenanceOtherR": ${ "$" + thousands(respondent.maintenance_other_received, show_decimals=True) } 
      - "line1aP": ${ "$" + thousands(petitioner.maintenance_received + petitioner.maintenance_other_received, show_decimals=True) } 
      - "line1aR": ${ "$" + thousands(respondent.maintenance_received + respondent.maintenance_other_received, show_decimals=True) } 
      - "line2aP": ${ "$" + thousands(petitioner.other_child_support_paid, show_decimals=True) } 
      - "line2aR": ${ "$" + thousands(respondent.other_child_support_paid, show_decimals=True) } 
      - "maintenanceR2": ${ "$" + thousands(respondent.maintenance_paid, show_decimals=True) } 
      - "maintenanceP2": ${ "$" + thousands(petitioner.maintenance_paid, show_decimals=True) } 
      - "maintenanceOtherPaidP": ${ "$" + thousands(petitioner.maintenance_other_paid, show_decimals=True) } 
      - "maintenanceOtherPaidR": ${ "$" + thousands(respondent.maintenance_other_paid, show_decimals=True) } 
      - "line2bP": ${ "$" + thousands(petitioner.maintenance_paid + petitioner.maintenance_other_paid, show_decimals=True) } 
      - "line2bR": ${ "$" + thousands(respondent.maintenance_paid + respondent.maintenance_other_paid, show_decimals=True) } 
      - "line6abP": ${ "$" + thousands(petitioner.work_childcare_expenses, show_decimals=True) } 
      - "line6abR": ${ "$" + thousands(respondent.work_childcare_expenses, show_decimals=True) } 
      - "line6cP": ${ "$" + thousands(petitioner.health_insurance_costs, show_decimals=True) } 
      - "line6cR": ${ "$" + thousands(respondent.health_insurance_costs, show_decimals=True) } 
      - "line6dP": ${ "$" + thousands(petitioner.extraordinary_medical_costs.total(times_per_year = 12), show_decimals=True) } 
      - "line6dR": ${ "$" + thousands(respondent.extraordinary_medical_costs.total(times_per_year = 12), show_decimals=True) } 
      - "line6eP": ${ "$" + thousands(sum([included_cost.total(times_per_year=12) for included_cost in petitioner.extraordinary_childrearing_costs if included_cost.included_in_form_14])) }
      - "line6eR": ${ "$" + thousands(sum([included_cost.total(times_per_year=12) for included_cost in respondent.extraordinary_childrearing_costs if included_cost.included_in_form_14])) }
      - "ieOtherExpensesP": ${ "$" + thousands(petitioner.expenses.total(times_per_year = 12), show_decimals=True) } 
      - "ieOtherExpensesR": ${ "$" + thousands(respondent.expenses.total(times_per_year = 12), show_decimals=True) } 
      - "ieTotalMonthlyExpensesR": ${ "$" + thousands(respondent.other_child_support_paid + respondent.maintenance_paid + respondent.maintenance_other_paid + respondent.work_childcare_expenses + respondent.health_insurance_costs + float(respondent.extraordinary_medical_costs.total(times_per_year = 12)) + float(sum([included_cost.total(times_per_year=12) for included_cost in respondent.extraordinary_childrearing_costs if included_cost.included_in_form_14])) + float(respondent.expenses.total(times_per_year = 12)), show_decimals=True) } 
      - "ieTotalMonthlyExpensesP": ${ "$" + thousands(petitioner.other_child_support_paid + petitioner.maintenance_paid + petitioner.maintenance_other_paid + petitioner.work_childcare_expenses + petitioner.health_insurance_costs + float(petitioner.extraordinary_medical_costs.total(times_per_year = 12)) + float(sum([included_cost.total(times_per_year=12) for included_cost in petitioner.extraordinary_childrearing_costs if included_cost.included_in_form_14])) + float(petitioner.expenses.total(times_per_year = 12)), show_decimals=True) } 
      - "ieDateOfNotice": ${ "" } 
      - "ieNameRow1": ${ people_served[0].name_full() } 
      - "ieServiceContactInformationRow1": ${ people_served[0].service_address_pdf }
      - "ieNameRow2": |
          % if len(people_served) > 1:
          ${ people_served[1].name_full() } 
          % endif
      - "ieServiceContactInformationRow2": |
          % if len(people_served) > 1:
          ${ people_served[1].service_address } 
          % endif
      - "ieNameRow3": |
          % if len(people_served) > 1:
          ${ people_served[2].name_full() } 
          % endif
      - "ieServiceContactInformationRow3": |
          % if len(people_served) > 1:
          ${ people_served[2].service_address } 
          % endif
      - "ieNameRow4": |
          % if len(people_served) > 1:
          ${ people_served[3].name_full() } 
          % endif
      - "ieServiceContactInformationRow4": |
          % if len(people_served) > 1:
          ${ people_served[3].service_address } 
          % endif
---
