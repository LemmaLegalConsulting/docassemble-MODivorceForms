fields:
  - Check all that apply: parenting_plan_B_author
    datatype: checkboxes
    choices:
      - ${ petitioner.name.full() }
      - ${ respondent.name.full() }
      - The court
      - The guardian ad litem
      - Other
---
id: parenting plan B author other object
objects: 
