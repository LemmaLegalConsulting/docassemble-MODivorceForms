---
id: parenting plan B author other question
reconsider:
  - people_choices

sets:
  - parenting_plan_B_author_other.name.first
  - parenting_plan_B_author_other.name.last
  - parenting_plan_B_author_other.name.middle
  - parenting_plan_B_author_other.name.suffix

question: |
  What other person helped write Part B of the parenting plan?

fields:
  - Existing person: parenting_plan_B_author_other
    datatype: object
    choices: people_choices
    disable others: True
    exclude:
     - users[0]
