---
id: communications question
question: Communication between parents
subquestion: |
  How should the parents communicate about the children? Check each box that is appropriate.
fields:
  - Communication methods:  communications
    datatype: checkboxes
    choices:
      - In person: in_person
      - Home telephone: home_telephone
      - Work telephone: work_telephone
      - Mobile telephone: mobile_telephone
      - Letter via U.S. Postal Service: letter
      - E-mail: email
      - Using a third person: third_party
---
id: follow up question for communications through third party
if: communications["third_party"]
reconsider: people_choices
sets:
 - communications_other.name.first
question: Communication
subquestion: |
  Who should the parties communicate through?
fields:
  - Existing person: communications_other
    datatype: object
    choices: people_choices
    disable others: True
  - code: |
      communications_other.name_fields()
---
id: object for communications third party
objects: 
  - communications_other: ALIndividual
---
id: dispute resolution question
question: Dispute Resolution Procedure
subquestion: |
  After your case has gone through the complete court process and you have your judgment, there may still be some things that you and your coparent disagree on later. When that happens, parents are usually encouraged to go to mediation to resolve their disagreements regarding the children. Mediated agreements are non-binding, meaning you do not have to follow them if you or your coparent choose not to. 

  [Do you want to learn more about mediation?](${ url_action('mediation_info') })
  
  If you try mediation and are still unable to agree on all issues, you will have to follow the proper court process to make changes and may need to [find an attorney](https://www.courts.mo.gov/page.jsp?id=611). 
fields:
  - "Is there another way you would like to resolve disagreements, in addition to mediation?": dispute_resolution
    datatype: area
    required: False
continue button field: ask_about_dispute_resolution
---
id: Parenting Plan Part A
question: Who helped write the parenting plan?
fields:
  - Check all that apply: parenting_plan_A_author
    datatype: checkboxes
    choices:
      - ${ petitioner }: petitioner
      - ${ respondent }: respondent
      - The court
      - The guardian ad litem
      - Other
---
id: parenting plan author other object
objects: 
  - parenting_plan_A_author_other: ALIndividual
---
---
id: other physical custody
reconsider:
  - people_choices

sets:
  - parenting_plan_A_author_other.name.first
  - parenting_plan_A_author_other.name.last
  - parenting_plan_A_author_other.name.middle
  - parenting_plan_A_author_other.name.suffix

question: |
  What other person helped write the parenting plan?

fields:
  - Existing person: parenting_plan_A_author_other
    datatype: object
    choices: people_choices
    disable others: True
    exclude:
     - users[0]
     - other_parties[0]
  - code: |
      parenting_plan_A_author_other.name_fields()
---
id: Vacation
question: Vacation Schedule
subquestion: |
  You can set aside a number of weeks each year during which one parent will have exclusive physical custody of the children and the regular schedules do not apply. However, during this period, the Holiday Schedule still applies. Petitioner shall have first choice of weeks in odd-numbered years. Respondent will have first choice of weeks in even-numbered years. The parent with the first choice of weeks must designate the vacation weeks by March 31 of each year. The parent with the second choice of weeks must designate the weeks by April 15 of each year
fields:
  - Do you want to set aside specific weeks for vacations?: vacation
    datatype: yesnoradio
  - How many weeks each year?: vacation_weeks
    datatype: number
    min: 0
    max: 52
    show if: vacation
  - Do you want to add any extra information about vacations?: vacation_invo
    datatype: area
    required: False
    show if: vacation
---
id: default location of exchange
question: Specific location for an exchange
fields:
  - Where should an exchange occur if a specific location for an exchange is not stated on the schedule?: location_of_exchange
    choices:
      - "All exchanges shall occur at the children’s school or child care provider when school or child care is in session.": school
      - ${ petitioner.possessive('residence')  }: petitioner_residence
      - ${ respondent.possessive('residence')  }: respondent_residence
      - "The parent receiving custody of the children shall pick up the children at the other parent’s residence.": pick_up
      - Other location: other
  - When should the exchange occur?: time_of_exchange
  - Where should the exchange occur when school or child care is not in session?: location_of_exchange_school_not_in_session
    datatype: area
    show if:
      variable: location_of_exchange
      is: school
  - Add a pick-up from school for the other parent?: add_pick_up
    datatype: yesnoradio
    show if:
      variable: location_of_exchange
      is: school
  - "Where should the exchange occur?  (Please include the full address)": location_of_exchange_specific_location
    datatype: area
    show if:
      variable: location_of_exchange
      is: other
  - Add a pick-up from the other location for the other parent?: add_pick_up
    datatype: yesnoradio
    show if:
      variable: location_of_exchange
      is: other
  - Time of the pickup: time_of_exchange2
    show if:
      variable: add_pick_up
      is: True
validation code: |
   if location_of_exchange == "pick_up":
     default_exchange_method = "Pick up"
     default_exchange_time = time_of_exchange
     default_exchange_location = "house"
     default_add_pick_up_from_school = False
     default_exchange_time2 = None
   if location_of_exchange == "school":
     default_exchange_method = "Drop off"
     default_exchange_time = time_of_exchange
     default_exchange_location = "school"
     default_add_pick_up_from_school = add_pick_up
     if add_pick_up:
       default_exchange_time2 = time_of_exchange2
     else:
       default_exchange_time2 = None
   if location_of_exchange == "other":
     default_exchange_method = "Drop off"
     default_exchange_time = time_of_exchange
     default_exchange_location = default_exchange_location_other
     default_add_pick_up_from_school = add_pick_up
     if add_pick_up:
       default_exchange_time2 = time_of_exchange2
     else:
       default_exchange_time2 = None
   if location_of_exchange == "petitioner_residence":
     default_exchange_method = "petitioner_residence"
     default_exchange_time = time_of_exchange
     default_exchange_location = "house"
     default_add_pick_up_from_school = False
     default_exchange_time2 = None
   if location_of_exchange == "respondent_residence":
     default_exchange_method = "respondent_residence"
     default_exchange_time = time_of_exchange
     default_exchange_location = "house"
     default_add_pick_up_from_school = False
     default_exchange_time2 = None
---
id: telephone contact
question: Telephone Contact with Children
fields:
  - Are there restrictions on the time to contact children?:  phone_contact
    datatype: yesnoradio
  - What is the earliest that a child can be contacted on the phone?: phone_contact_am
    choices:
      - 5 am: 5
      - 6 am: 6
      - 7 am: 7
      - 8 am: 8
      - 9 am: 9
      - 10 am: 10
    show if: phone_contact
  - What is the latest that a child can be contacted on the phone?: phone_contact_pm
    choices:
      - 6 pm: 6
      - 7 pm: 7
      - 8 pm: 8
      - 9 pm: 9
      - 10 pm: 10
      - 11 pm: 12
      - 12 pm: 12
    show if: phone_contact
---
question: Domestic Violence
fields:
  - Has there been a pattern of domestic violence between the parents?: domestic_violence
    datatype: yesnoradio
  - Who has committed the domestic violence?: domestic_violence_committed_by
    choices:
      - ${ petitioner }: petitioner
      - ${ respondent }: respondent
      - Both: both
    show if: domestic_violence
  - note: |
      If the court restricts a parent’s visitation or custody with a child due to domestic violence, the court may also restrict that parent’s access to address information within a child’s educational records.
    show if: domestic_violence
  - Should the address information be restricted?: educational_records_include_victim_address
    datatype: yesnoradio
    show if: domestic_violence
    
---
id: Health Expenses Not Covered by Insurance
question: Health Expenses Not Covered by Insurance
fields:
  - Who should pay health expenses not covered by insurance?: health_expenses_not_covered
    choices:
     - ${ support_recipient }: support_recipient
     - ${ support_payer }: support_payer
     - "All reasonable and necessary medical or dental expenses of the children are covered by insurance." : none
  - Should that other parent reimburse for a percentage of thse expenses?: health_expenses_not_covered_reimburse
    datatype: yesnoradio
    js show if: |
      val('health_expenses_not_covered') === "support_recipient" || val('health_expenses_not_covered') === "support_payer"
  - What percentage?: health_expenses_not_covered_reimburse_percentage
    datatype: number
    min: 0
    max: 100
    js show if: |
      val('health_expenses_not_covered_reimburse') === true
      
---
id: use presumed child support
question:  Presumed Child Support amount
subquestion: |
  Based on the information you provided, it looks like  ${ support_payer.name_full() } should pay ${ currency(support_payer.presumed_child_support_amount_12 if support_payer.presumed_child_support_amount_12 > 0 else 0 ) } in child support.
fields:
  - Should the court order this amount in monthly child support?: use_presumed_child_support
    datatype: radio
    choices:
      - Yes, this amount is correct.: yes
      - No, the child support amount should be different than ${ currency(support_payer.presumed_child_support_amount_12 if support_payer.presumed_child_support_amount_12 > 0 else 0 ) }: no
  - Why is the presumed child support amount unjust and inappropriate?: use_presumed_child_support_explanation
    show if: 
      variable: use_presumed_child_support
      is: no
---
variable name: var_doc_dict["use_presumed_child_support"]
data:
  - parenting_plan_attachment
---
id: child support starting date
question: Child support starting date      
fields:
  - When should the child support start?: child_support_start_date
    datatype: radio
    choices:
      - The first child support payment is due on the date of the entry of the judgment.: judgment_date
      - The first child support payment is due on a designated date: specific_date
  - Date: child_support_start_date_other_date
    datatype: date
    show if:
      variable: child_support_start_date
      is: specific_date
---
id: child support method of payment
question: Method of payment of Child Support
fields:
  - How should child support be paid?: child_support_method_of_payment
    datatype: radio
    choices:
      - Child support shall be paid through income withholding.: income_withholding
      - Income withholding will not issue because a written agreement has been reached between the parents that provides for an alternative arrangement.: no_agreement
      - Income withholding will not issue because there is good cause not to require immediate income withholding for the reason that implementation of an immediate withholding would not be in the best interest of the child and the parent paying support has made timely payments of all previously ordered support.: no_not_in_best_interest
  - Should child support be paid at the Family Support Payment Center or directly to ${ support_recipient.name_full() }: child_support_location_of_payment
    datatype: radio
    choices:
      - Child support shall be paid directly to the Family Support Payment Center, PO Box 109001, Jefferson City, Missouri, 65110-9001: fpsc
      - Directly to ${ support_recipient.name_full() }: direct_payment
    js show if: |
      val('child_support_method_of_payment') == "no_agreement" || val('child_support_method_of_payment') == "no_not_in_best_interest"
---
id: tax deduction info for child
question:  Tax Deductions for ${ children[i].name_full() }
fields:
  - Who should be allowed to claim ${ children[i].name_full() } as a tax deduction in even years?: children[i].tax_dependency_even
    datatype: radio
    choices:
      - ${ support_recipient.name_full() }
      - ${ support_payer.name_full() }
  - Who should be allowed to claim ${ children[i].name_full() } as a tax deduction in odd years?: children[i].tax_dependency_odd
    datatype: radio
    choices:
      - ${ support_recipient.name_full() }
      - ${ support_payer.name_full() }
  - note: |
      The child support form (Form 14) usually expects the parent who receives support to claim the children on their taxes every year. If you want the parent who pays support to claim one or more of the children at any time, that’s okay. Just know there will be a checkbox on your papers that says “The Form 14 guidelines are unjust and inappropriate,” which means you chose a different option.
---
id: visitation nights
question: Overnights
subquestion: |
  % if defined('support_payer.visitation_nights_default'):
  Based on the parenting plan you created: ${ support_payer } should have ${ support_payer.visitation_nights_default } overnights per year.
  % else:
  How many overnights per year does ${ support_payer } have?
  % endif
fields:
  - Visitation nights: visitation_nights
    datatype: integer
    min: 0
    max: 365
    default: ${ showifdef('support_payer.visitation_nights_default') }
---
id: form_14_starting calculations
generic object: ALIndividual
code: |
  x.monthly_income_1 = float(x.jobs.total(times_per_year=12)) + x.self_employment_income + float(x.other_incomes.total(times_per_year = 12))
  if x.monthly_income_1 < 1300:
    x.support_obligation_2c2_income_index = 1300
  elif x.monthly_income_1 > 30000:
    x.support_obligation_2c2_income_index = 40000
  else:
    x.support_obligation_2c2_income_index = (x.monthly_income_1+25)//50*50
  if x.other_children == 0:
    x.support_obligation_2c2 = 0
  elif basic_child_support_schedule[str(x.other_children)][str("{:.0f}".format(x.support_obligation_2c2_income_index))]['poverty']:
    x.support_obligation_2c2 = basic_child_support_schedule[str(x.other_children)][str("{:.0f}".format(x.support_obligation_2c2_income_index))]['obligation']
  else:
    x.support_obligation_2c2 = basic_child_support_schedule[str(x.other_children)][str("{:.0f}".format(x.support_obligation_2c2_income_index))]['obligation']
  x.total_adjustment_2c = x.support_obligation_2c2 - x.other_child_support_received
  if (x.monthly_income_1 + x.maintenance_received - x.other_child_support_paid - x.maintenance_paid - x.maintenance_other_paid - x.total_adjustment_2c) > 0:
    x.adjusted_monthly_gross_income_3 = x.monthly_income_1 + x.maintenance_received - x.other_child_support_paid - x.maintenance_paid - x.maintenance_other_paid - x.total_adjustment_2c
  else:
    x.adjusted_monthly_gross_income_3 = 0
  x.form_14_starting_calculations = True  
---
code: |
  basic_child_support_schedule = objects_from_file("basic_child_support_schedule.json")
---  
id: form 14 calculations
reconsider:
  - support_payer.form_14_starting_calculations
  - support_recipient.form_14_starting_calculations
code: |
  combined_adjusted_income_3 = support_payer.adjusted_monthly_gross_income_3 + support_recipient.adjusted_monthly_gross_income_3
  if combined_adjusted_income_3 != 0:
    support_payer.income_share_4 = support_payer.adjusted_monthly_gross_income_3/combined_adjusted_income_3
    support_recipient.income_share_4 = support_recipient.adjusted_monthly_gross_income_3/combined_adjusted_income_3
  else:
    support_payer.income_share_4 = 0
    support_recipient.income_share_4 = 0
  if combined_adjusted_income_3 < 1300:
    combined_income_index = 1300
  elif combined_adjusted_income_3 > 40000:
    combined_income_index = 40000
  else:
    combined_income_index = (combined_adjusted_income_3+25)//50*50
  if number_of_children > 6:
    basic_child_support_amount_5 = basic_child_support_schedule["6"][str("{:.0f}".format(combined_income_index))]["obligation"]
  else:
    basic_child_support_amount_5 = basic_child_support_schedule[str("{:.0f}".format(number_of_children))][str("{:.0f}".format(combined_income_index))]["obligation"]
  if support_recipient.adjusted_monthly_gross_income_3 < 1251:
    credit_subtract = 0
  elif support_recipient.adjusted_monthly_gross_income_3 > 3583:
    credit_subtract = .15
  else:
    credit_subtract = ((support_recipient.adjusted_monthly_gross_income_3-1250)//166.5+1)/100
  if number_of_children == 1:
    if support_recipient.work_childcare_expenses > 250:
      support_recipient.childcare_tax_credit_6a2 = 250*(.35-credit_subtract)
    else:
      support_recipient.childcare_tax_credit_6a2 = support_recipient.work_childcare_expenses*(.35-credit_subtract)
  else:
    if support_recipient.work_childcare_expenses > 500:
      support_recipient.childcare_tax_credit_6a2 = 500*(.35-credit_subtract)
    else: 
      support_recipient.childcare_tax_credit_6a2 = support_recipient.work_childcare_expenses*(.35-credit_subtract)
  support_recipient.total_adjusted_child_care_costs_6a = support_recipient.work_childcare_expenses - support_recipient.childcare_tax_credit_6a2
  support_recipient.total_childrearing_costs_7 =  support_recipient.total_adjusted_child_care_costs_6a + support_recipient.health_insurance_costs + float(support_recipient.extraordinary_medical_costs.total(times_per_year=12)) + float(sum([cost.total(times_per_year=12) for cost in support_recipient.extraordinary_childrearing_costs if cost.included_in_form_14]))
  support_payer.total_childrearing_costs_7  = support_payer.work_childcare_expenses + support_payer.health_insurance_costs + float(support_payer.extraordinary_medical_costs.total(times_per_year=12)) + float(sum([cost.total(times_per_year=12) for cost in support_payer.extraordinary_childrearing_costs if cost.included_in_form_14]))
  total_childrearing_costs_7 = support_recipient.total_childrearing_costs_7 + support_payer.total_childrearing_costs_7
  combined_child_support_costs_8 = basic_child_support_amount_5 + total_childrearing_costs_7
  support_payer.support_obligation_9 = combined_child_support_costs_8 * support_payer.income_share_4
  support_recipient.support_obligation_9 = combined_child_support_costs_8 * support_recipient.income_share_4
  support_payer.childrearing_credit_10 = support_payer.total_childrearing_costs_7
  if visitation_nights < 36:
    support_payer.visitation_adjustment_11_percentage = 0
  elif visitation_nights < 73:
    support_payer.visitation_adjustment_11_percentage = 6
  elif visitation_nights < 92:
    support_payer.visitation_adjustment_11_percentage = 9
  elif visitation_nights < 110:
    support_payer.visitation_adjustment_11_percentage = 10
  elif visitation_nights < 116:
    support_payer.visitation_adjustment_11_percentage = 13
  elif visitation_nights < 120:
    support_payer.visitation_adjustment_11_percentage = 15
  elif visitation_nights < 126:
    support_payer.visitation_adjustment_11_percentage = 17
  elif visitation_nights < 131:
    support_payer.visitation_adjustment_11_percentage = 20
  elif visitation_nights < 137:
    support_payer.visitation_adjustment_11_percentage = 23
  elif visitation_nights < 142:
    support_payer.visitation_adjustment_11_percentage = 25
  elif visitation_nights < 148:
    support_payer.visitation_adjustment_11_percentage = 27
  elif visitation_nights < 153:
    support_payer.visitation_adjustment_11_percentage = 28
  elif visitation_nights < 159:
    support_payer.visitation_adjustment_11_percentage = 29
  elif visitation_nights < 165:
    support_payer.visitation_adjustment_11_percentage = 30
  elif visitation_nights < 171:
    support_payer.visitation_adjustment_11_percentage = 31
  elif visitation_nights < 176:
    support_payer.visitation_adjustment_11_percentage = 32
  elif visitation_nights < 181:
    support_payer.visitation_adjustment_11_percentage = 33
  else:
    support_payer.visitation_adjustment_11_percentage = 33
  support_payer.visitation_adjustment_11 = basic_child_support_amount_5*support_payer.visitation_adjustment_11_percentage*.01
  support_payer.presumed_child_support_amount_12 = support_payer.support_obligation_9 - support_payer.childrearing_credit_10 - support_payer.visitation_adjustment_11
  if number_of_children > 5:
    basic_child_support_amount_5_6 = basic_child_support_schedule["6"][str("{:.0f}".format(combined_income_index))]["obligation"]
    support_payer.presumed_child_support_amount_6_children = (basic_child_support_amount_5_6 + total_childrearing_costs_7) * support_payer.income_share_4 - support_payer.childrearing_credit_10 - (basic_child_support_amount_5_6) * support_payer.visitation_adjustment_11_percentage*.01
  else:
    support_payer.presumed_child_support_amount_6_children = None
  if number_of_children > 4:
    basic_child_support_amount_5_5 = basic_child_support_schedule["5"][str("{:.0f}".format(combined_income_index))]["obligation"]
    support_payer.presumed_child_support_amount_5_children = (basic_child_support_amount_5_5 + total_childrearing_costs_7) * support_payer.income_share_4 - support_payer.childrearing_credit_10 - (basic_child_support_amount_5_5) * support_payer.visitation_adjustment_11_percentage*.01
  else:
    support_payer.presumed_child_support_amount_5_children = None
  if number_of_children > 3:
    basic_child_support_amount_5_4 = basic_child_support_schedule["4"][str("{:.0f}".format(combined_income_index))]["obligation"]
    support_payer.presumed_child_support_amount_4_children = (basic_child_support_amount_5_4 + total_childrearing_costs_7) * support_payer.income_share_4 - support_payer.childrearing_credit_10 - (basic_child_support_amount_5_4) * support_payer.visitation_adjustment_11_percentage*.01
  else:
    support_payer.presumed_child_support_amount_4_children = None
  if number_of_children > 2:
    basic_child_support_amount_5_3 = basic_child_support_schedule["3"][str("{:.0f}".format(combined_income_index))]["obligation"]
    support_payer.presumed_child_support_amount_3_children = (basic_child_support_amount_5_3 + total_childrearing_costs_7) * support_payer.income_share_4 - support_payer.childrearing_credit_10 - (basic_child_support_amount_5_3) * support_payer.visitation_adjustment_11_percentage*.01
  else:
    support_payer.presumed_child_support_amount_3_children = None
  if number_of_children > 1:
    basic_child_support_amount_5_2 = basic_child_support_schedule["2"][str("{:.0f}".format(combined_income_index))]["obligation"]
    support_payer.presumed_child_support_amount_2_children = (basic_child_support_amount_5_2 + total_childrearing_costs_7) * support_payer.income_share_4 - support_payer.childrearing_credit_10 - (basic_child_support_amount_5_2) * support_payer.visitation_adjustment_11_percentage*.01
  else:
    support_payer.presumed_child_support_amount_2_children = None
  if number_of_children > 0:
    basic_child_support_amount_5_1 = basic_child_support_schedule["1"][str("{:.0f}".format(combined_income_index))]["obligation"]
    support_payer.presumed_child_support_amount_1_children = (basic_child_support_amount_5_1 + total_childrearing_costs_7) - support_payer.childrearing_credit_10 - (basic_child_support_amount_5_1) * support_payer.visitation_adjustment_11_percentage*.01
  else:
    support_payer.presumed_child_support_amount_1_children = None
  form_14_calculations = True
  
---
variable name: var_doc_dict["form_14_calculations"]
data:
  - parenting_plan_attachment
  - form_14_attachment
---
id: Parenting Plan object
objects:
  - parenting_plan_attachment: ALDocument.using(title="Parenting Plan", filename="Parenting_Plan", has_addendum=False, )
---
id: Parenting Plan attachment
attachment:
  name: Parenting Plan
  filename: Parenting_Plan
  variable name: parenting_plan_attachment[i]
  skip undefined: True
  pdf template file: parenting_plan.pdf
  editable: False
  fields:
      - "countyList1": ${ case.county } 
      - "petitionersSuffixJrSrIII": ${ petitioner.name.suffix } 
      - "petitionersFirstName": ${ petitioner.name.first } 
      - "petitionersMiddleName": ${ petitioner.name.middle } 
      - "petitionersLastName": ${ petitioner.name.last } 
      - "pCaseNumber": ${ case.docket_number } 
      - "respondentsMiddleName": ${ respondent.name.middle } 
      - "respondentsSuffixJrSrIII": ${ respondent.name.suffix } 
      - "respondentsLastName": ${ respondent.name.last } 
      - "respondentsFirstName": ${ respondent.name.first } 
      - "pDivisionNumber": ${ case.division_number } 
      - "pAuthorsBothParentsA": ${ parenting_plan_A_author["petitioner"] and parenting_plan_A_author["respondent"]  } 
      - "pAuthorsPetitionerA": ${ parenting_plan_A_author["petitioner"] and not parenting_plan_A_author["respondent"] } 
      - "pAuthorsRespondentA": ${ parenting_plan_A_author["respondent"] and not parenting_plan_A_author["petitioner"] } 
