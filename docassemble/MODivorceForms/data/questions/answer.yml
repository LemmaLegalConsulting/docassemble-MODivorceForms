
---
id: Agree with Parenting Plan
question: Agree with Parenting Plan
fields:
  - Do you agree with the Parenting Plan filed by ${ petitioner }?: agree_with_parenting_plan
    datatype: yesnoradio
---
id: Active Duty and Servicemember Civil Relief Act
question: Active Duty
subquestion: |

  ${ collapse_template(servicemember_template) }
fields:
  - Do you waive your rights pursuant to the Servicemembers Civil Relief Act of 2003?: waive_rights
    datatype: yesnoradio
---
id: Servicemembers Civil Relief Act template
template: servicemember_template
subject: What is the Servicemembers Civil Relief Act?
content: |
  The Servicemembers Civil Relief Act protects active-duty military from receiving a disadvantage in legal proceedings solely because they are unable to attend court hearings. This act may allow a servicemember to request a delay of the proceedings while on active duty or prevent a default judgment if the servicemember cannot appear due to being on active duty.
---
id: denials question for answer
question: Denials
subquestion: |
  Is there anything you disagree with on your spouses Petition for Dissolution of Marriage?
  
  Any statement that you do not specifically deny in your Answer to their Petition will be considered "admitted" by the court, and you may not have the opportunity to disagree with this statement later.
fields:
  - Is there anything in the Petition that you deny?: denials_exist
    datatype: yesnoradio
  - Explain: denials
    datatype: area
    show if: denials_exist
---
id: Respondent's Answer to Petition for Dissolution of Marriage object
