---
generic object: DAObject
code: |
  if len(x.ld_list.complete_elements()) == 0 or manual_reset:
    x.ld_list.question_code = list()
    for ld in x.loan_description_code.split("+"):
      x.ld_list.appendObject()
      x.ld_list[-1].ld_code_parsed = ld.strip()
      x.ld_list[-1].space_test = x.ld_list[-1].ld_code_parsed[:6]
      if 'space(' == x.ld_list[-1].ld_code_parsed[:6]:
        x.ld_list[-1].type = "attribute"
        x.ld_list[-1].methods = "space"
        x.ld_list[-1].temp_method = x.ld_list[-1].ld_code_parsed[7:-1].split(",")
        x.ld_list[-1].attribute = x.ld_list[-1].temp_method[0][1:-1].split(".")[-1]
        if "display_name" in x.ld_list[-1].attribute:
          if len([ex.example for ex in x.attributes if hasattr(ex,"example") and hasattr(ex,'field') and ex.field.split(".")[1] == "source"]) > 0:
            x.ld_list[-1].example = str([ex.example for ex in x.attributes if hasattr(ex,"example") and hasattr(ex,'field') and ex.field.split(".")[1] == "source"][0])
          else:
            x.ld_list[-1].example = ""
        else:
          if len([ex.example for ex in x.attributes if hasattr(ex,"example") and hasattr(ex,'field') and ex.field.split(".")[1] == "source"]) > 0:
            x.ld_list[-1].example = str([ex.example for ex in x.attributes if hasattr(ex,"example") and hasattr(ex,'field') and ex.field.split(".")[1] == x.ld_list[-1].attribute][0])
          else:
            x.ld_list[-1].example = ""
        x.ld_list[-1].initializeAttribute('method_parameters',DADict.using(auto_gather=False, gathered = True))
        for parameter in x.ld_list[-1].temp_method[1:]:
          x.ld_list[-1].temp_key = parameter.split("=")[0].strip()
          x.ld_list[-1].temp_value = parameter.split("=")[1].strip()
          x.ld_list[-1].method_parameters[x.ld_list[-1].temp_key] = x.ld_list[-1].temp_value
      elif '.' in x.ld_list[-1].ld_code_parsed and " " not in x.ld_list[-1].ld_code_parsed:
        x.ld_list[-1].type = "attribute"
        x.ld_list[-1].methods = "none"
        x.ld_list[-1].attribute = ld.split(".")[-1]
        if "display_name" in x.ld_list[-1].attribute:
          if len([ex.example for ex in x.attributes if hasattr(ex,"example") and hasattr(ex,'field') and ex.field.split(".")[1] == "source"]) > 0:
            x.ld_list[-1].example = str([ex.example for ex in x.attributes if hasattr(ex,"example") and hasattr(ex,'field') and ex.field.split(".")[1]== "source"][0]) 
          else:
            x.ld_list[-1].example = ""
        else:
          if len([ex.example for ex in x.attributes if hasattr(ex,"example") and hasattr(ex,'field') and ex.field.split(".")[1] == "source"]) > 0:
            x.ld_list[-1].example = str([ex.example for ex in x.attributes if hasattr(ex,"example") and hasattr(ex,'field') and ex.field.split(".")[1]== x.ld_list[-1].attribute][0])
          else:
            x.ld_list[-1].example = ""
        x.ld_list[-1].initializeAttribute('method_parameters', DADict.using(object_type=DAObject, auto_gather=False, gathered = True))
      else:
        x.ld_list[-1].type = "text"
        x.ld_list[-1].text = ld.strip()
        x.ld_list[-1].initializeAttribute('method_parameters', DADict.using(object_type=DAObject, auto_gather=False, gathered = True))
  x.ld_list.gathered = True
