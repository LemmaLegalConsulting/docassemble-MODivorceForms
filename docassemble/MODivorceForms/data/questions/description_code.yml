---
generic object: DAList
table: x.description_table
rows: x
columns:
  - Part: |
      row_index
  - Text: |
      row_item.text if row_item.type == "text" else row_item.attribute
  - Space: |
      "NA" if row_item.type == "text" else showifdef("row_item.methods")
  - Prefix: |
      "NA" if not hasattr(row_item, 'methods') or showifdef("row_item.methods") != "space" else showifdef("row_item.method_parameters['prefix']")  
  - Suffix: |
      "NA" if not hasattr(row_item, 'methods') or  showifdef("row_item.methods") != "space" else  showifdef("row_item.method_parameters['suffix']")  
  - Example: |
      row_item.text if row_item.type == "text" else showifdef('row_item.example')
allow reordering: True
confirm: True
edit:
  - type
---

generic object: DAObject
question: Loan description type for ${ x.display_name }
subquestion: |
 [TARGET description_review_target]
fields:
  - Type: x.ld_list[i].type
    choices:
      - attribute
      - text
  - Text: x.ld_list[i].text 
    show if:
      variable: x.ld_list[i].type
      is: text
  - Attribute: x.ld_list[i].attribute
    show if:
      variable: x.ld_list[i].type
      is: attribute
    datatype: code
    code: |
      [att.field.split('.')[1] for att in x.attributes if not hasattr(att,'note')]
  - Space: x.ld_list[i].methods
    show if:
      variable: x.ld_list[i].type
      is: attribute
    choices:
      - space
      - no space
  - Prefix: x.ld_list[i].method_parameters['prefix']
    show if:
      variable: x.ld_list[i].methods
      is: space
  - Suffix: x.ld_list[i].method_parameters['suffix']
    show if:
      variable:  x.ld_list[i].methods
      is: space
  - Example: x.ld_list[i].example
    show if:
      variable:  x.ld_list[i].type
      is: attribute
check in: description_review_template
---
template: description_review_template
content: |
  This section lets you see how your updates will look in the whole description statement.<br><br>
  % if action_argument('x.ld_list[i].type') == "attribute":
  
  The "example" for the attribute can be changed for testing in this interview.  The example is not used in the final interview or documents.<br><br>
  % if action_argument('x.ld_list[i].methods') == "space":
  
  You can set it to add a space before or after an attribute.  The quotation marks are left in the fields and the example so it is easier to see when there is a space.  The quotation marks will not be in the final interview or documents.<br><br>
  % endif
  % elif action_argument('x.ld_list[i].type') == "text":

  The text, in both the field and the example on this page, must have quotation marks so spaces before or after the text can be clearly shown.  In the examples on other pages, and in the final interview, these quotation marks won't be shown.<br><br>
  % endif
  
  
  % for ld in x.ld_list:
  % if loop.index == i:
  % if action_argument('x.ld_list[i].type') == "attribute":
  % if action_argument('x.ld_list[i].methods') == "space":
  **${ action_argument("x.ld_list[i].method_parameters['prefix']") }${ action_argument("x.ld_list[i].example") or "[BLANK]" }${ action_argument("x.ld_list[i].method_parameters['suffix']") }**\
  % else:
  **${ action_argument('x.ld_list[i].example') or "[BLANK]" }**\
  % endif
  % else:
  **${ action_argument('x.ld_list[i].text') or "[BLANK]" }**\
  % endif
    % else:
  % if ld.type == "attribute":
  % if ld.methods == "space":
  ${ space(str('ld.example'), prefix= ld.method_parameters['prefix'][1:-1], suffix= ld.method_parameters['suffix'][1:-1])}\
  % else:
  ${ ld.example }\
  % endif
  % else:
  ${ ld.text }\
  % endif
  % endif
  % endfor      

target: description_review_target
---
